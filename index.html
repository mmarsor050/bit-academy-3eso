/* ================= CONSTRUCTOR GENERAL ================= */
const TIPOS={inicio:'Inicio',proceso:'Proceso',decision:'Decisión',entrada:'Entrada',salida:'Salida',bucle:'Repetir',fin:'Fin'};
function nuevoBloque(tipo){const b={id:'b'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),tipo,texto:''};if(tipo==='decision'){b.si=[''];b.no=['']}if(tipo==='bucle'){b.veces=3;b.siempre=false;b.cuerpo=['']}return b}
let pend=null;
function preguntarSiNo(q){return new Promise(res=>{pend=res;const a=$('#ask');a.innerHTML=`<div class="ask"><b>🤖 BIT te pregunta:</b> ${esc(q)}<div class="fila" style="margin-top:8px"><button class="btn verde sm" data-a="1">SÍ</button><button class="btn rojo sm" data-a="0">NO</button></div></div>`;a.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{a.innerHTML='';pend=null;res(b.dataset.a==='1')})})}
function pedirDato(q){return new Promise(res=>{pend=res;const a=$('#ask');a.innerHTML=`<div class="ask"><b>📥 ${esc(q)}</b><div class="fila" style="margin-top:8px"><input class="campo" id="dat" style="flex:1;min-width:140px" autocomplete="off"><button class="btn sm" id="okd">Enviar</button></div></div>`;const i=$('#dat');i.focus();const f=()=>{const v=i.value.trim();if(!v){i.focus();return}a.innerHTML='';pend=null;res(v)};$('#okd').onclick=f;i.onkeydown=e=>{if(e.key==='Enter')f()}})}
function validar(f,cfg){
  if(!f.length)return['El diagrama está vacío. Empieza con «+ Inicio».',-1];
  if(f[0].tipo!=='inicio')return['Todo diagrama empieza con el bloque INICIO arriba del todo.',0];
  const n=t=>f.filter(b=>b.tipo===t).length;
  if(n('inicio')>1)return['Solo puede haber un INICIO.',f.findIndex((b,i)=>i>0&&b.tipo==='inicio')];
  if(n('fin')>1)return['Solo puede haber un FIN.',f.findIndex(b=>b.tipo==='fin')];
  const is=f.findIndex(b=>b.tipo==='bucle'&&b.siempre);
  if(is>=0&&is<f.length-1)return['Un bucle «para siempre» no termina nunca: lo que pongas debajo (también el FIN) no se ejecutará jamás. Quita esos bloques o pon un número de repeticiones.',is];
  if(f[f.length-1].tipo!=='fin'&&is!==f.length-1)return['El último bloque tiene que ser FIN. Si no, ¿cómo sabe BIT que ha terminado?',f.length-1];
  for(let i=0;i<f.length;i++){const b=f[i];
    if(['proceso','entrada','salida'].includes(b.tipo)&&!b.texto.trim())return[`Hay un bloque de ${TIPOS[b.tipo].toLowerCase()} sin texto. Escribe qué hace BIT.`,i];
    if(b.tipo==='decision'){
      if(!b.texto.trim())return['Escribe la pregunta dentro del rombo.',i];
      if(!/[?？]/.test(b.texto))return['La pregunta de una decisión se responde con SÍ o NO: escríbela entre signos de interrogación, por ejemplo «¿Llueve?».',i];
      if(![...b.si,...b.no].some(t=>t.trim()))return['Pon al menos un paso en la rama SÍ o en la rama NO.',i];
    }
    if(b.tipo==='bucle'){
      if(!b.siempre&&!(b.veces>=2&&b.veces<=100))return['El número de repeticiones tiene que estar entre 2 y 100.',i];
      if(!b.cuerpo.some(t=>t.trim()))return['Escribe qué pasos se repiten dentro del bucle.',i];
    }
  }
  const r=cfg.req&&cfg.req(f); if(r)return[r,-1];
  return null;
}
function constructorGen(el,m,cfg){
  if(!S.m[m].flow)S.m[m].flow=[];
  const F=()=>S.m[m].flow, B=id=>F().find(b=>b.id===id);
  el.innerHTML=`<div class="grid2"><div class="panel"><h2>${cfg.titulo}</h2>${cfg.reto}
   <div class="fila">${cfg.tipos.map(t=>`<button class="btn sm pal-${t}" data-add="${t}">+ ${TIPOS[t]}</button>`).join('')}
   ${cfg.importar?'<button class="btn amarillo sm" id="imp">📥 Traer mis pasos de la Misión 1</button>':''}<button class="btn blanco sm" id="vaciar">🗑️ Vaciar</button></div>
   <ol class="flow" id="fl"></ol>
   <div class="fila"><button class="btn verde" id="run">▶ Ejecutar diagrama</button><button class="btn rojo sm oculto" id="stop">■ Parar</button></div></div>
   <div class="pegado"><div class="scene" id="sc"><span class="deco">🗺️</span><div class="bubble" id="bb">Constrúyeme un diagrama y lo sigo paso a paso.</div>${bitSVG('bc')}</div><div id="ask"></div><div id="res"></div></div></div>`;
  const fl=$('#fl');
  const sub=(b,c,etq)=>`<div class="sub"><div class="subt">${etq}</div>${b[c].map((t,j)=>`<div class="subp"><input data-c="${c}" data-j="${j}" value="${esc(t)}" placeholder="Paso" aria-label="${etq} paso ${j+1}"><button class="x" data-subdel="${c}" data-j="${j}" aria-label="Borrar paso">✕</button></div>`).join('')}<button class="mini2" data-subadd="${c}">+ paso</button></div>`;
  const html=b=>{const del='<button class="x" data-del aria-label="Borrar bloque">✕</button>',h='<span class="handle" aria-hidden="true">⠿</span>';
    switch(b.tipo){
      case 'inicio':case 'fin':return `<div class="blk ${b.tipo}">${h}<span style="flex:1">${b.tipo==='inicio'?'INICIO':'FIN'}</span>${del}</div>`;
      case 'proceso':return `<div class="blk proceso">${h}<input data-t value="${esc(b.texto)}" placeholder="¿Qué hace BIT?" aria-label="Proceso">${del}</div>`;
      case 'entrada':return `<div class="blk es">${h}<span class="tag">📥 ENTRADA</span><input data-t value="${esc(b.texto)}" placeholder="¿Qué pide? Ej.: Pedir tu nombre" aria-label="Entrada">${del}</div>`;
      case 'salida':return `<div class="blk es">${h}<span class="tag">📤 SALIDA</span><input data-t value="${esc(b.texto)}" placeholder="¿Qué muestra? Usa [dato]" aria-label="Salida">${del}</div>`;
      case 'decision':return `<div class="blk decision">${h}<span>◆</span><input data-t value="${esc(b.texto)}" placeholder="¿Pregunta? Ej.: ¿Llueve?" aria-label="Pregunta">${del}</div><div class="ramas">${sub(b,'si','SÍ')}${sub(b,'no','NO')}</div>`;
      case 'bucle':return `<div class="blk bucle">${h}<span>🔁 Repetir</span><input type="number" data-v min="2" max="100" value="${b.veces}" ${b.siempre?'disabled':''} aria-label="Repeticiones" style="max-width:70px"><span>veces</span><label class="siempre"><input type="checkbox" data-s ${b.siempre?'checked':''}> siempre</label>${del}</div><div class="ramas una">${sub(b,'cuerpo','Se repite:')}</div>`;
    }};
  const pintar=()=>{fl.innerHTML=F().map(b=>`<li data-id="${b.id}">${html(b)}</li>`).join('')||'<li class="muted">El diagrama está vacío. Empieza con «+ Inicio».</li>'};
  pintar();
  fl.addEventListener('input',e=>{const t=e.target,li=t.closest('li');if(!li||!li.dataset.id)return;const b=B(li.dataset.id);
    if(t.hasAttribute('data-t'))b.texto=t.value; else if(t.dataset.c)b[t.dataset.c][+t.dataset.j]=t.value; else if(t.hasAttribute('data-v'))b.veces=parseInt(t.value)||0; save()});
  fl.addEventListener('change',e=>{const t=e.target;if(!t.hasAttribute('data-s'))return;B(t.closest('li').dataset.id).siempre=t.checked;save();pintar()});
  fl.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const li=t.closest('li');if(!li||!li.dataset.id)return;const b=B(li.dataset.id);
    if(t.hasAttribute('data-del')){S.m[m].flow=F().filter(x=>x!==b)}
    else if(t.dataset.subadd){b[t.dataset.subadd].push('')}
    else if(t.dataset.subdel){b[t.dataset.subdel].splice(+t.dataset.j,1);if(t.dataset.subdel==='cuerpo'&&!b.cuerpo.length)b.cuerpo.push('')}
    else return; save();pintar()});
  ordenable(fl,()=>{const ids=[...fl.children].map(li=>li.dataset.id);S.m[m].flow=ids.map(B).filter(Boolean);save();pintar()});
  el.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const t=b.dataset.add,nb=nuevoBloque(t),f=F();
    if(t==='inicio')f.unshift(nb); else if(t!=='fin'&&f.length&&f[f.length-1].tipo==='fin')f.splice(f.length-1,0,nb); else f.push(nb);
    save();pintar();const li=fl.querySelector(`li[data-id="${nb.id}"]`),i=li&&li.querySelector('input');if(i)i.focus()});
  if($('#imp'))$('#imp').onclick=()=>{const f=F(),nv=cfg.importar();if(f.length&&f[f.length-1].tipo==='fin')f.splice(f.length-1,0,...nv);else f.push(...nv);save();pintar();toast('Pasos importados: comprueba que tienes Inicio y Fin')};
  $('#vaciar').onclick=()=>{S.m[m].flow=[];save();pintar();$('#res').innerHTML=''};
  let parar=false;
  $('#stop').onclick=()=>{parar=true;if(pend){$('#ask').innerHTML='';const p=pend;pend=null;p(null)}};
  $('#run').onclick=async()=>{
    const f=F(), v=validar(f,cfg), lis=[...fl.children], sc=$('#sc');
    fl.querySelectorAll('.run,.err').forEach(x=>x.classList.remove('run','err'));
    if(v){$('#res').innerHTML=`<div class="nota mal">❌ ${v[0]}</div>`;if(v[1]>=0&&lis[v[1]])lis[v[1]].querySelector('.blk').classList.add('err');sacude(sc);$('#bb').textContent='No puedo seguir este diagrama 😵';return}
    $('#res').innerHTML='';parar=false;sc.classList.remove('feliz','shake');
    el.querySelectorAll('button').forEach(b=>b.disabled=true);fl.querySelectorAll('input').forEach(i=>i.disabled=true);
    const st=$('#stop');st.disabled=false;st.classList.remove('oculto');
    const mk=n=>{fl.querySelectorAll('.run').forEach(x=>x.classList.remove('run'));if(n){n.classList.add('run');n.scrollIntoView({block:'nearest',behavior:'smooth'})}};
    const di=async(t,ms=850)=>{$('#bb').textContent=t;await sleep(ms)};
    let dato='';
    for(let i=0;i<f.length&&!parar;i++){const b=f[i],li=lis[i];mk(li.querySelector('.blk'));
      if(b.tipo==='inicio')await di('Empiezo…');
      else if(b.tipo==='fin')await di('¡FIN! Algoritmo terminado. 🎉');
      else if(b.tipo==='proceso')await di('Ahora: '+b.texto);
      else if(b.tipo==='entrada'){$('#bb').textContent='📥 '+b.texto;const d=await pedirDato(b.texto);if(d===null)break;dato=d;await di(`He guardado el dato: «${dato}»`)}
      else if(b.tipo==='salida')await di('📤 '+b.texto.replace(/\[dato\]/gi,dato||'(sin dato)'),1500);
      else if(b.tipo==='decision'){$('#bb').textContent='🤔 '+b.texto;const r=await preguntarSiNo(b.texto);if(r===null)break;const c=r?'si':'no',ins=[...li.querySelectorAll(`input[data-c="${c}"]`)],ps=b[c].map((t,j)=>[t,ins[j]]).filter(([t])=>t.trim());
        if(!ps.length)await di(`Respuesta ${r?'SÍ':'NO'}: por esta rama no hay nada que hacer. Sigo.`);
        for(const [t,n] of ps){if(parar)break;mk(n);await di(`(${r?'SÍ':'NO'}) Ahora: ${t}`)}}
      else if(b.tipo==='bucle'){const ins=[...li.querySelectorAll('input[data-c="cuerpo"]')],ps=b.cuerpo.map((t,j)=>[t,ins[j]]).filter(([t])=>t.trim()),n=b.siempre?Infinity:b.veces;
        for(let k=0;k<n&&!parar;k++){if(b.siempre&&k>=25){await di('🔋 BIT se ha quedado sin batería después de 25 vueltas. ¡Un bucle para siempre no se para solo!',1800);break}
          for(const [t,nd] of ps){if(parar)break;mk(nd);await di(`Vuelta ${k+1}${b.siempre?'':' de '+n}: ${t}`,450)}}}
    }
    const parado=parar; mk(null);$('#ask').innerHTML='';st.classList.add('oculto');el.querySelectorAll('button').forEach(b=>b.disabled=false);pintar();
    if(parado&&!f.some(b=>b.tipo==='bucle'&&b.siempre)){$('#bb').textContent='Me has parado a mitad.';return}
    sc.classList.add('feliz');
    $('#res').innerHTML=`<div class="nota ok"><b>¡Diagrama correcto!</b> ${cfg.exito||''}${parado?' Lo has parado tú: así se detiene un bucle para siempre.':''}</div>`;
    addXP(`m${m}-cons`,30);done(m,'constructor');
  };
}

async function correSent(g){
  const bit=$('#bg'),bb=$('#bb'),sc=$('#sc'),cnt=$('#cnt');bit.setAttribute('class','bit shirt');sc.classList.remove('feliz','shake');cnt.textContent=0;
  const nom={agach:'Agacharse',levanta:'Levantarse',saluda:'Saludar',aplaude:'Aplaudir'};
  let abajo=false,reps=0;
  const hacer=async(a,pref)=>{if(a==='nada')return null;bb.textContent=`${pref}${nom[a]}`;
    if(a==='agach'){if(abajo)return'¡BIT ya está agachado y no puede bajar más! 😵 Revisa el orden: después de agacharse tiene que levantarse.';abajo=true;bit.classList.add('agachado')}
    else if(a==='levanta'){if(!abajo)return'BIT ya está de pie… ¡no puede levantarse otra vez! 🤔 Primero tiene que agacharse.';abajo=false;bit.classList.remove('agachado');cnt.textContent=++reps}
    else if(a==='saluda'){bit.classList.add('saluda');await sleep(380);bit.classList.remove('saluda')}
    else if(a==='aplaude'){bit.classList.add('aplaude');bb.textContent='👏 ¡Clap!';await sleep(200);bit.classList.remove('aplaude');await sleep(120);bit.classList.add('aplaude');await sleep(200);bit.classList.remove('aplaude')}
    await sleep(380);return null};
  if(g.n<1)return[false,'Pon un número de repeticiones.'];
  if(g.b1==='nada'&&g.b2==='nada')return[false,'El bucle está vacío: BIT se queda quieto esperando órdenes. 😐'];
  for(let k=1;k<=g.n;k++){for(const a of [g.b1,g.b2]){const e=await hacer(a,`Vuelta ${k}: `);if(e){sacude(sc);return[false,e]}}}
  if(abajo){sacude(sc);return[false,'¡BIT se ha quedado agachado! 🦵 Le falta levantarse en cada vuelta.']}
  const e=await hacer(g.post,'Después: ');if(e){sacude(sc);return[false,e]}
  if(reps<10)return[false,`BIT solo ha hecho ${reps} sentadilla${reps===1?'':'s'}. ¡Le faltan ${10-reps}!`];
  if(reps>10)return[false,`BIT ha hecho ${reps} sentadillas y el entrenador pedía 10. ¡Te sobran ${reps-10} vueltas!`];
  if(g.post!=='saluda'){sacude(sc);return[false,g.post==='nada'?'Las 10 sentadillas están perfectas, pero BIT no ha saludado al terminar. ¿Qué bloque falta después del bucle?':`Las 10 sentadillas están perfectas, pero al final BIT tenía que saludar, no ${nom[g.post].toLowerCase()}.`]}
  if([g.b1,g.b2].includes('saluda'))return[false,'BIT ha saludado en cada sentadilla. El saludo va fuera del bucle, solo una vez al final.'];
  sc.classList.add('feliz');bb.textContent='¡10 sentadillas y un saludo! 💪👋';
  return[true,'<b>¡Reto superado!</b> Con un bucle de 2 acciones repetido 10 veces, BIT ha hecho 20 movimientos. Y el saludo fuera del bucle solo se hace una vez.'];
}
async function correCuad(g){
  const tr=$('#trazos'),to=$('#tort'),bb=$('#bb');tr.innerHTML='';
  let x=90,y=230,ang=-90,lados=0,giros=new Set();const x0=x,y0=y;
  const pon=()=>{to.style.transform=`translate(${x}px,${y}px) rotate(${ang}deg)`};pon();await sleep(300);
  if(g.n<1)return[false,'Pon un número de repeticiones.'];
  const cuerpo=[g.b1,g.b2].filter(a=>a!=='nada');
  if(!cuerpo.length)return[false,'El bucle está vacío: BIT no se mueve y la hoja sigue en blanco.'];
  for(let k=1;k<=g.n;k++){for(const a of cuerpo){
    if(a==='avanza'){const nx=x+100*Math.cos(ang*Math.PI/180),ny=y+100*Math.sin(ang*Math.PI/180);
      const l=document.createElementNS('http://www.w3.org/2000/svg','line');l.setAttribute('x1',x);l.setAttribute('y1',y);l.setAttribute('x2',x);l.setAttribute('y2',y);tr.appendChild(l);
      x=nx;y=ny;pon();bb.textContent=`Vuelta ${k}: avanzo 100 pasos ✏️`;
      for(let t=1;t<=10;t++){l.setAttribute('x2',+l.getAttribute('x1')+(x-l.getAttribute('x1'))*t/10);l.setAttribute('y2',+l.getAttribute('y1')+(y-l.getAttribute('y1'))*t/10);await sleep(35)}lados++}
    else{const d={g90:90,g120:120,g60:60}[a];giros.add(d);ang+=d;pon();bb.textContent=`Vuelta ${k}: giro ${d}° ↻`;await sleep(420)}}}
  const cerrado=Math.hypot(x-x0,y-y0)<1;
  if(!cuerpo.includes('avanza'))return[false,'BIT solo gira sobre sí mismo: sin avanzar, el lápiz no dibuja nada. 🌀'];
  if(!cuerpo.some(a=>a!=='avanza'))return[false,'BIT avanza siempre en línea recta… ¡y se sale de la hoja! Le falta girar en cada esquina.'];
  if(giros.has(120)||giros.has(60)){const f=giros.has(120)?'un triángulo':'un hexágono';return[false,`¡Eso no es un cuadrado! Con ese giro BIT dibuja ${cerrado?'':'parte de '}${f}. Las esquinas de un cuadrado miden 90°.`]}
  if(lados<4)return[false,`BIT solo ha dibujado ${lados} lado${lados===1?'':'s'} y el cuadrado ha quedado abierto. ¡Faltan ${4-lados}!`];
  if(lados>4)return[false,`El cuadrado se ve bien… pero BIT ha repasado ${lados-4} lado${lados-4===1?'':'s'} de más. Sobran vueltas en el bucle.`];
  bb.textContent='¡Cuadrado perfecto! ⬛🎉';
  return[true,'<b>¡Reto superado!</b> 4 vueltas de «avanzar y girar 90°». Así se dibuja con el lápiz de Scratch, que verás en la próxima unidad.'];
}

const ALF='0123456789ABCDEFGHJKMNPQRSTVWXYZ';

 {m:['######','S....#','####.#','G..#.#','##.#.#','##...#'],d:1},

RX[6]=(el,id)=>{
  const E=expE(),X=E.x[6]||(E.x[6]={});X.prog=X.prog||[];
  el.innerHTML=`<div class="panel" style="margin-bottom:16px"><h2>Un programa para todos los laberintos</h2><p>Ahora BIT tiene <b>sensores</b>: puede saber si hay camino delante, a la derecha o a la izquierda. Escribe <b>un solo programa</b> que saque a BIT de los <b>tres</b> laberintos. Se probará en los tres a la vez. Óptimo: 6 bloques.</p>
   <div class="fila"><button class="btn amarillo sm" id="xp6">💡 Pista (−5 XP)</button></div><div id="xpc"></div></div>
   <div class="grid2" style="grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)"><div class="panel"><div id="edi"></div><div class="fila" style="margin-top:10px"><button class="btn verde" id="ir">▶ Probar en los 3 laberintos</button></div></div>
    <div class="pegado"><div class="panel"><div style="display:grid;gap:10px" id="tabs"></div><div id="ires"></div></div></div></div>`;
  expPista(id,['🔎 Usa «repetir hasta llegar a la 🏁» para que BIT siga hasta el final, sea cual sea la longitud del camino.','🔎 Dentro: si hay camino delante → avanzar; si no → mira si hay camino a la izquierda para girar a la izquierda, y si no, gira a la derecha.'],$('#xp6'),$('#xpc'));
  const dib=k=>(pos,dir,rec)=>{const c=$('#tabs').children[k];if(c)c.innerHTML=tablero(LABI[k].m,pos,dir,rec)};
  LABI.forEach((L,k)=>{const d=document.createElement('div');d.title='Laberinto '+(k+1);$('#tabs').appendChild(d);let p;L.m.forEach((f,y)=>[...f].forEach((c,x)=>{if(c==='S')p=[x,y]}));d.innerHTML=tablero(L.m,p,L.d,new Set())});
  const ed=editorG($('#edi'),{get:()=>X.prog,set:v=>{X.prog=v;save()},piezas:PZ_LAB,contenedores:CONT_INT});
  $('#ir').onclick=async()=>{const P=ed.leer();$('#ir').disabled=true;$('#ires').innerHTML='';
    const rs=await Promise.all(LABI.map((L,k)=>correCuadricula(L.m,L.d,P,{dibuja:dib(k)})));$('#ir').disabled=false;
    const msg={meta:'✅ ¡Meta!',choque:'💥 Choque contra una pared',bucle:'🔁 BIT da vueltas sin llegar nunca',corto:'⏹️ El programa terminó antes de llegar'};
    $('#ires').innerHTML=rs.map((r,k)=>`<div class="nota ${r.res==='meta'?'ok':'mal'}" style="margin:6px 0">Laberinto ${k+1}: ${msg[r.res]}</div>`).join('');
    if(rs.every(r=>r.res==='meta')){const n=contar(P);X.best=Math.min(X.best||99,n);save();$('#ires').innerHTML+=`<div class="nota ok"><b>¡Programa general!</b> Funciona en los tres laberintos con ${n} bloques. ${n<=6?'Solución óptima.':'Se puede hacer con 6.'}</div>`;expFin(id,X.best<=6,{bloques:X.best})}
    else if(rs.some(r=>r.res==='meta'))$('#ires').innerHTML+='<div class="nota idea">Tu programa sirve para algún laberinto, pero no para todos: necesita decidir según lo que detecta.</div>'};
};
/* ---- Reto 7: algoritmos clásicos ---- */
RX[7]=(el,id)=>{
  const E=expE(),X=E.x[7]||(E.x[7]={});X.rondas=X.rondas||[];X.ord=X.ord||null;
  el.innerHTML=`<div class="panel" style="margin-bottom:16px"><h2>Algoritmos clásicos</h2><p>Dos problemas que los ordenadores resuelven millones de veces al día: <b>buscar</b> y <b>ordenar</b>.</p><div class="fila"><button class="btn amarillo sm" id="xp7">💡 Pista (−5 XP)</button></div><div id="xpc"></div></div>
   <div class="grid2"><div class="panel"><h2>A · Adivina el número</h2><p>BIT piensa un número del <b>1 al 100</b>. Tras cada intento te dice si es mayor o menor. Gana <b>3 rondas</b>. Óptimo: 7 intentos o menos en cada ronda.</p>
    <div class="fila"><input class="campo" id="gn" inputmode="numeric" style="max-width:120px" aria-label="Número"><button class="btn" id="gb">Probar</button><button class="btn blanco sm" id="gnew">🎲 Nueva ronda</button></div>
    <div class="pant" id="gp" style="margin-top:10px;background:#0E1A2B;color:#7EF0C1;border-radius:12px;padding:12px;font-family:var(--display)">Pulsa «Nueva ronda».</div><p id="gr" class="muted"></p></div>
   <div class="panel"><h2>B · Ordena las cartas</h2><p>Ordena las cartas de menor a mayor. Solo puedes <b>intercambiar dos cartas vecinas</b> (pulsa ⇄ entre ellas), como hace el algoritmo de la burbuja. Óptimo: el mínimo de intercambios posible.</p>
    <div id="cartas" class="fila" style="gap:4px;justify-content:center;margin:12px 0"></div><p>Intercambios: <b id="ci">0</b></p><div class="fila"><button class="btn blanco sm" id="cnew">🔀 Nuevas cartas</button></div><div id="cres"></div></div></div>`;
  expPista(id,['🔎 Adivina: empieza siempre por el número del medio (50). Si es mayor, prueba el medio de lo que queda (75)… Cada intento descarta la mitad.','🔎 Cartas: busca la carta más pequeña y llévala a la izquierda intercambiando vecinas. Cada intercambio debe arreglar un par desordenado.'],$('#xp7'),$('#xpc'));
  let secreto=null,intentos=0;
  const gr=()=>{$('#gr').textContent=`Rondas ganadas: ${X.rondas.length}/3 · Intentos: ${X.rondas.join(', ')||'—'}`};gr();
  const check=()=>{if(X.rondas.length>=3&&X.ordOK)expFin(id,X.rondas.slice(0,3).every(n=>n<=7)&&X.ordOpt,{bloques:X.rondas.slice(0,3).reduce((a,b)=>a+b,0)})};
  $('#gnew').onclick=()=>{secreto=1+Math.floor(Math.random()*100);intentos=0;$('#gp').textContent='He pensado un número del 1 al 100. ¡Adivínalo!';$('#gn').value='';$('#gn').focus()};
  const prueba=()=>{if(secreto===null){toast('Pulsa «Nueva ronda»');return}const v=parseInt($('#gn').value);if(!(v>=1&&v<=100)){$('#gp').textContent='Escribe un número del 1 al 100.';return}intentos++;$('#gn').value='';$('#gn').focus();
    if(v===secreto){$('#gp').textContent=`🎉 ¡Era el ${v}! Lo has adivinado en ${intentos} intento${intentos>1?'s':''}.`;if(X.rondas.length<3){X.rondas.push(intentos);save()}secreto=null;gr();check()}
    else $('#gp').textContent=`Intento ${intentos}: el número es ${v<secreto?'MAYOR':'MENOR'} que ${v}.`};
  $('#gb').onclick=prueba;$('#gn').onkeydown=e=>{if(e.key==='Enter')prueba()};
  let cartas,swaps,minimo;
  const inv=a=>{let n=0;for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++)if(a[i]>a[j])n++;return n};
  const nuevas=()=>{do{cartas=shuffle([3,7,12,18,25,31])}while(inv(cartas)<6);swaps=0;minimo=inv(cartas);pinta();$('#cres').innerHTML=''};
  const pinta=()=>{$('#cartas').innerHTML=cartas.map((c,i)=>`<div style="width:48px;height:68px;border:3px solid var(--tinta);border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.3rem;background:var(--sup)">${c}</div>${i<cartas.length-1?`<button class="mini" data-s="${i}" aria-label="Intercambiar">⇄</button>`:''}`).join('');$('#ci').textContent=swaps;
    $('#cartas').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const i=+b.dataset.s;[cartas[i],cartas[i+1]]=[cartas[i+1],cartas[i]];swaps++;pinta();
      if(cartas.every((c,k)=>k===0||cartas[k-1]<=c)){const opt=swaps<=minimo;$('#cres').innerHTML=`<div class="nota ${opt?'ok':'idea'}">✅ ¡Ordenadas con ${swaps} intercambios! ${opt?'Es el mínimo posible.':`El mínimo era ${minimo}: algún intercambio no hacía falta.`}</div>`;X.ordOK=1;X.ordOpt=X.ordOpt||opt;save();check()}})};
  $('#cnew').onclick=nuevas;nuevas();
};
/* ---- Reto 8: reto final experto ---- */
const MAPF=[
 {m:['S.P.##','###.##','###..#','####.#','#G.P.#','######'],d:1},
 {m:['S#####','P#.P.#','.#.#.#','.#.#P#','..P#.G','######'],d:2},
];
RX[8]=(el,id)=>{
  const E=expE(),X=E.x[8]||(E.x[8]={});X.prog=X.prog||[];
  el.innerHTML=`<div class="panel" style="margin-bottom:16px"><h2>🏆 BIT, el robot repartidor</h2><p>BIT recorre un pasillo, recoge todos los 📦 que encuentra y, al llegar a la 🏁, <b>dice cuántos ha recogido</b>. Tu programa tiene que funcionar en los <b>dos mapas</b> a la vez. Necesitarás un bucle «hasta llegar», condiciones con sensores y la variable <b>paquetes</b> (el bloque «recoger» la aumenta en 1). Óptimo: 9 bloques.</p>
   <div class="fila"><button class="btn amarillo sm" id="xp8">💡 Pista (−5 XP)</button></div><div id="xpc"></div></div>
   <div class="grid2" style="grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)"><div class="panel"><div id="edf"></div><div class="fila" style="margin-top:10px"><button class="btn verde" id="fr8">▶ Probar en los 2 mapas</button></div></div>
    <div class="pegado"><div class="panel"><div style="display:grid;gap:10px" id="tabs8"></div><div class="log" id="lg8" style="margin-top:10px;background:#0E1A2B;color:#7EF0C1;font-family:ui-monospace,monospace;border-radius:12px;padding:10px;min-height:60px;max-height:160px;overflow:auto;white-space:pre-wrap"></div><div id="fres"></div></div></div></div>`;
  expPista(id,['🔎 Parte del programa del laberinto inteligente y añade, dentro del bucle, una condición «si hay un paquete aquí → recoger».','🔎 «decir paquetes» va fuera del bucle, al final, cuando BIT ya ha llegado a la 🏁.'],$('#xp8'),$('#xpc'));
  const dib=k=>(pos,dir,rec)=>{const c=$('#tabs8').children[k];if(c)c.innerHTML=tablero(MAPF[k].m,pos,dir,rec)};
  MAPF.forEach((L,k)=>{const d=document.createElement('div');$('#tabs8').appendChild(d);let p;L.m.forEach((f,y)=>[...f].forEach((c,x)=>{if(c==='S')p=[x,y]}));d.innerHTML=tablero(L.m,p,L.d,new Set())});
  const pz=Object.assign({},PZ_LAB,{recoger:{cls:'fijar',def:()=>({k:'recoger'}),html:()=>'📦 recoger (paquetes + 1)'},decirp:{cls:'decirv',def:()=>({k:'decirp'}),html:()=>'💬 decir paquetes'}});
  const ed=editorG($('#edf'),{get:()=>X.prog,set:v=>{X.prog=v;save()},piezas:pz,contenedores:CONT_INT});
  $('#fr8').onclick=async()=>{const P=ed.leer(),lg=$('#lg8');lg.textContent='';$('#fr8').disabled=true;$('#fres').innerHTML='';
    const rs=await Promise.all(MAPF.map((L,k)=>correCuadricula(L.m,L.d,P,{dibuja:dib(k),decir:(t,v)=>{if(!v){lg.textContent+=`Mapa ${k+1} > BIT dice: ${t}\n`;lg.scrollTop=lg.scrollHeight}}})));$('#fr8').disabled=false;
    const msg=r=>r.res!=='meta'?({choque:'💥 Choque contra una pared',bucle:'🔁 BIT da vueltas sin llegar nunca',corto:'⏹️ El programa terminó antes de llegar'})[r.res]:r.paq<r.total?`📦 Ha llegado, pero solo ha recogido ${r.paq} de ${r.total} paquetes`:r.out.length===0?'💬 Ha llegado con todo, pero no ha dicho cuántos paquetes tiene':r.out[r.out.length-1]!==r.total||r.out.length>1?'💬 Ha dicho un número equivocado o lo ha dicho más de una vez':'✅ ¡Reparto perfecto!';
    const ok=rs.map(r=>r.res==='meta'&&r.paq===r.total&&r.out.length===1&&r.out[0]===r.total);
    $('#fres').innerHTML=rs.map((r,k)=>`<div class="nota ${ok[k]?'ok':'mal'}" style="margin:6px 0">Mapa ${k+1}: ${msg(r)}</div>`).join('');
    if(ok.every(Boolean)){const n=contar(P);X.best=Math.min(X.best||99,n);save();$('#fres').innerHTML+=`<div class="nota ok"><b>🏆 ¡Reto final superado!</b> ${n} bloques. ${n<=9?'Solución óptima.':'Se puede hacer con 9.'} Has combinado bucles, condiciones, sensores y variables: así se programan los robots de verdad.</div>`;expFin(id,X.best<=9,{bloques:X.best})}};
};

/* ================= ARRANQUE ================= */
$('#goHome').onclick=()=>ir('home');
$('#ajustes').onclick=()=>{$('#dlgInfo').textContent=ACT?`${S.name} · ${S.grupo} · ${S.xp} XP`:'Todavía no has entrado en ningún perfil.';$('#camb').classList.toggle('oculto',!ACT);$('#parBtn').classList.toggle('oculto',!ACT);$('#reset').classList.toggle('oculto',!ACT);$('#dlg').showModal()};
$('#tema').onclick=()=>{const r=document.documentElement,oscuro=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=oscuro?'light':'dark';try{localStorage.setItem('academiaBit3.tema',r.dataset.theme)}catch(e){}};
$('#parBtn').onclick=()=>{$('#dlg').close();ir('pareja')};
$('#camb').onclick=()=>{$('#dlg').close();salir();ir('login')};
$('#reset').onclick=async()=>{$('#dlg').close();if(!ACT)return;if(await confirmar('¿Seguro? Se borrarán tus XP, tus insignias y tu competición. Tu perfil y tu PIN se mantienen.','Borrar')){S=normS({name:S.name,grupo:S.grupo,color:S.color});S.m[0].done.reg=true;S.badges[0]=Date.now();save();ir('home')}};
(function(){const sel=$('#lang');sel.innerHTML=IDIOMAS.map(([k,t])=>`<option value="${k}">${t}</option>`).join('');sel.value=LANG;
  sel.onchange=()=>{LANG=sel.value;LS.set(PREF+'.lang',LANG);if(ACT){S.lang=LANG;save()}traducirEstatico();render()}})();
traducirEstatico();
render();
</script>
