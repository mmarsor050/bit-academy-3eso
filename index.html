<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="author" content="Manuel Martín Soriano">
<link rel="license" href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.es">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Academia de Robots · Unidad 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
<style>
:root{
  --papel:#F2F7FB; --rejilla:#DDE8F1; --tinta:#16263D; --tinta2:#4B5D76;
  --sup:#FFFFFF; --sup2:#E9F1F8; --borde:#C5D4E2;
  --azul:#2F6FEB; --azul-o:#1D4FB8; --verde:#149E6C; --verde-o:#0C7650;
  --amarillo:#FFC23D; --amarillo-o:#D99A10; --rojo:#E0474C; --naranja:#FF8A3D;
  --bitc:#2F6FEB; --pantalla:#0E1A2B; --ojo:#7EF0C1;
  --display:"Fredoka","Trebuchet MS",system-ui,"Microsoft YaHei","PingFang SC","Noto Sans SC","Noto Sans CJK SC",sans-serif;
  --texto:"Atkinson Hyperlegible","Segoe UI",system-ui,"Microsoft YaHei","PingFang SC","Noto Sans SC","Noto Sans CJK SC",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --papel:#0E1826; --rejilla:#172638; --tinta:#E7EFF8; --tinta2:#A7B8CC;
    --sup:#15243A; --sup2:#1B2E47; --borde:#2B4260; --pantalla:#050B14;
  }
}
:root[data-theme="dark"]{
  --papel:#0E1826; --rejilla:#172638; --tinta:#E7EFF8; --tinta2:#A7B8CC;
  --sup:#15243A; --sup2:#1B2E47; --borde:#2B4260; --pantalla:#050B14;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; min-height:100%; color:var(--tinta); font-family:var(--texto); font-size:18px; line-height:1.55;
  background-color:var(--papel);
  background-image:linear-gradient(var(--rejilla) 1px,transparent 1px),linear-gradient(90deg,var(--rejilla) 1px,transparent 1px);
  background-size:28px 28px;
}
h1,h2,h3{font-family:var(--display); line-height:1.15; margin:0 0 .5em; font-weight:600}
h1{font-size:2.3rem} h2{font-size:1.7rem} h3{font-size:1.25rem}
p{margin:0 0 .8em; max-width:68ch}
a{color:var(--azul)}
img,svg{max-width:100%}
button{font:inherit; cursor:pointer}
:focus-visible{outline:3px solid var(--amarillo); outline-offset:3px; border-radius:6px}

/* Barra superior */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--sup); border-bottom:3px solid var(--tinta);
  display:flex; align-items:center; gap:14px; padding:10px 18px}
.logo{display:flex; align-items:center; gap:10px; font-family:var(--display); font-weight:700; font-size:1.25rem; background:none; border:0; color:var(--tinta); padding:0}
.logo svg{width:38px; height:44px}
.top .sp{flex:1}
.chip{display:flex; align-items:center; gap:6px; font-family:var(--display); font-weight:600; background:var(--sup2); border:2px solid var(--borde); border-radius:999px; padding:4px 12px; font-size:1rem}
.chip b{font-size:1.1rem}
.icon-btn{background:var(--sup2); border:2px solid var(--borde); border-radius:12px; width:42px; height:42px; font-size:1.2rem; color:var(--tinta)}

main{max-width:1120px; margin:0 auto; padding:24px 18px 60px}

/* Botones de juguete */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; font-family:var(--display); font-weight:600; font-size:1.05rem;
  border:3px solid var(--tinta); border-radius:14px; padding:10px 18px; background:var(--azul); color:#fff;
  box-shadow:0 4px 0 var(--tinta); transition:transform .08s, box-shadow .08s}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--tinta)}
.btn:disabled{opacity:.5; cursor:not-allowed}
.btn.verde{background:var(--verde)} .btn.amarillo{background:var(--amarillo); color:#16263D} .btn.blanco{background:var(--sup); color:var(--tinta)}
.btn.rojo{background:var(--rojo)}
.btn.sm{font-size:.95rem; padding:6px 12px; border-width:2px; box-shadow:0 3px 0 var(--tinta)}
.fila{display:flex; flex-wrap:wrap; gap:12px; align-items:center}

.panel{background:var(--sup); border:3px solid var(--tinta); border-radius:20px; padding:22px}
.nota{background:var(--sup2); border-left:6px solid var(--azul); border-radius:10px; padding:12px 16px; margin:12px 0}
.nota.ok{border-color:var(--verde)} .nota.mal{border-color:var(--rojo)} .nota.idea{border-color:var(--amarillo)}
.muted{color:var(--tinta2)}

/* Mapa de misiones */
.hero{display:grid; grid-template-columns:minmax(0,1fr) 220px; gap:24px; align-items:center; margin-bottom:28px}
.hero h1{font-size:2.6rem}
.hero .bit{width:200px}
.mapa{position:relative; padding-left:0; list-style:none; margin:0}
.mapa li{position:relative; display:grid; grid-template-columns:64px minmax(0,1fr); gap:16px; padding-bottom:18px}
.mapa li::before{content:""; position:absolute; left:30px; top:60px; bottom:-4px; width:4px; background:var(--tinta); opacity:.25}
.mapa li:last-child::before{display:none}
.nodo{width:64px; height:64px; border-radius:50%; border:3px solid var(--tinta); display:grid; place-items:center; font-family:var(--display); font-weight:700; font-size:1.5rem; background:var(--sup)}
.mapa li.hecha .nodo{background:var(--verde); color:#fff}
.mapa li.abierta .nodo{background:var(--amarillo); color:#16263D}
.mapa li.cerrada .nodo{background:var(--sup2); color:var(--tinta2); border-style:dashed}
.mcard{text-align:left; width:100%; background:var(--sup); border:3px solid var(--tinta); border-radius:18px; padding:14px 18px; color:var(--tinta);
  display:flex; align-items:center; gap:14px; box-shadow:0 4px 0 var(--tinta)}
.mcard:disabled{box-shadow:none; border-style:dashed; border-color:var(--borde); cursor:default}
.mcard h3{margin:0}
.mcard .estado{margin-left:auto; font-family:var(--display); font-weight:600; font-size:.95rem; white-space:nowrap}
.mcard .emo{font-size:1.8rem}

/* Misión */
.mhead{display:flex; align-items:center; gap:14px; margin-bottom:16px; flex-wrap:wrap}
.mhead h1{margin:0; font-size:2rem}
.pasos{display:flex; gap:8px; flex-wrap:wrap; margin:0 0 22px; padding:0; list-style:none; counter-reset:f}
.pasos button{font-family:var(--display); font-weight:600; font-size:.95rem; border:2px solid var(--tinta); border-radius:999px; background:var(--sup); color:var(--tinta); padding:6px 14px 6px 8px; display:flex; align-items:center; gap:8px}
.pasos button .n{color:var(--tinta); display:grid; place-items:center; width:26px; height:26px; border-radius:50%; background:var(--sup2); border:2px solid var(--tinta); font-size:.85rem}
.pasos button.act{background:var(--tinta); color:var(--papel)}
.pasos button.hecho .n{background:var(--verde); color:#fff; border-color:var(--tinta)}
.grid2{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:22px; align-items:start}
.grid3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px}
.nav-fase{display:flex; justify-content:space-between; margin-top:22px; gap:12px; flex-wrap:wrap}

/* Escena de BIT */
.scene{position:relative; border:3px solid var(--tinta); border-radius:20px; overflow:hidden; min-height:340px; display:flex; align-items:flex-end; justify-content:center;
  background:linear-gradient(#F9E7C9 0 72%, #C79A6B 72% 100%)}
.scene.fuera{background:linear-gradient(#9ED4FF 0 64%, #8C949E 64% 70%, #5B636D 70% 100%)}
.scene .deco{position:absolute; left:14px; top:12px; font-size:2rem}
.scene .bit{width:190px; margin-bottom:6px; position:relative; z-index:2}
.bubble{position:absolute; top:14px; right:14px; left:70px; background:#fff; color:#16263D; border:3px solid #16263D; border-radius:16px; padding:10px 14px; font-family:var(--display); font-weight:500; font-size:1.05rem; z-index:3; min-height:48px}
.bubble:empty{display:none}
.scene.shake .bit{animation:shake .5s}
@keyframes shake{20%{transform:translateX(-10px) rotate(-4deg)}40%{transform:translateX(10px) rotate(4deg)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.scene.feliz .bit{animation:salto .6s 2}
@keyframes salto{50%{transform:translateY(-22px)}}
.bit .antena{animation:parpadeo 1.6s infinite}
@keyframes parpadeo{50%{opacity:.35}}

/* capas de BIT */
.bit .l-wet,.bit .l-socks,.bit .l-shoes,.bit .l-over,.bit .l-pack,.bit .l-shirt,.bit .l-dirty,.bit .l-shine,.bit .l-sleep{display:none}
.bit.sleep .l-sleep{display:inline} .bit.sleep .l-eyes{display:none}
.bit.wet .l-wet{display:inline} .bit.socks .l-socks{display:inline} .bit.shoes .l-shoes{display:inline}
.bit.over .l-over{display:inline} .bit.pack .l-pack{display:inline} .bit.shirt .l-shirt{display:inline}
.bit.dirty .l-dirty{display:inline} .bit.shine .l-shine{display:inline}

/* Tarjetas de pasos ordenables */
.lista{list-style:none; margin:0; padding:0; display:grid; gap:8px}
.lista li{display:flex; align-items:center; gap:10px; background:var(--sup); border:2px solid var(--tinta); border-radius:12px; padding:8px 10px; font-weight:700}
.lista li .num{font-family:var(--display); min-width:28px; height:28px; border-radius:8px; display:grid; place-items:center; background:var(--sup2); border:2px solid var(--borde)}
.lista li .emo{font-size:1.4rem}
.lista li .txt{flex:1}
.lista li.run{background:var(--amarillo); color:#16263D}
.lista li.ok{background:#CFF3E3; color:#16263D}
.lista li.mal{background:#FFD3D4; color:#16263D; border-color:var(--rojo)}
.handle{cursor:grab; font-size:1.3rem; color:var(--tinta2); user-select:none; padding:0 4px}
.mini{background:var(--sup2); border:2px solid var(--borde); border-radius:8px; width:32px; height:32px; color:var(--tinta); font-size:.9rem; padding:0}
.ghost{opacity:.4}
.lista input{flex:1; font:inherit; font-weight:400; border:2px solid var(--borde); border-radius:8px; padding:6px 10px; background:var(--papel); color:var(--tinta); min-width:0}

/* Conceptos */
.concepto{background:var(--sup); border:3px solid var(--tinta); border-radius:18px; padding:16px}
.concepto .emo{font-size:2rem}
.regla{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px; margin-top:8px}
.regla div{border-radius:10px; padding:8px 10px; font-size:.95rem}
.regla .no{background:#FFE1E2; color:#16263D} .regla .si{background:#D5F5E6; color:#16263D}

/* Quiz */
.q{margin-bottom:18px}
.q .ops{display:grid; gap:8px; margin-top:8px}
.op{text-align:left; background:var(--sup); color:var(--tinta); border:2px solid var(--tinta); border-radius:12px; padding:10px 14px; font-weight:700}
.op.bien{background:#CFF3E3; color:#16263D; border-color:var(--verde)}
.op.malo{background:#FFD3D4; color:#16263D; border-color:var(--rojo)}
.op:disabled{cursor:default}

/* Diagramas de flujo */
.flow{list-style:none; margin:0; padding:10px 0; display:flex; flex-direction:column; align-items:center; gap:0; min-height:120px}
.flow li{display:flex; flex-direction:column; align-items:center}
.flow li + li::before{content:""; display:block; width:4px; height:18px; background:var(--tinta)}
.flow li + li .blk{position:relative}
.flow li + li .blk::before{content:""; position:absolute; top:-10px; left:50%; transform:translateX(-50%); border:8px solid transparent; border-top:10px solid var(--tinta)}
.blk{display:flex; align-items:center; gap:8px; border:3px solid var(--tinta); color:#fff; font-weight:700; min-width:260px; max-width:380px; width:100%; padding:10px 14px; justify-content:center; text-align:center}
.blk.inicio,.blk.fin{background:var(--verde); border-radius:999px; font-family:var(--display); letter-spacing:.02em}
.blk.proceso{background:var(--azul); border-radius:4px}
.blk input{flex:1; font:inherit; font-weight:700; color:#16263D; background:#fff; border:0; border-radius:6px; padding:4px 8px; min-width:0}
.blk .x{background:rgba(255,255,255,.25); color:#fff; border:0; border-radius:6px; width:28px; height:28px; padding:0}
.blk .handle{color:rgba(255,255,255,.85)}
.blk.run{outline:5px solid var(--amarillo); outline-offset:3px}
.blk.err{outline:5px solid var(--rojo); outline-offset:3px}
.blk.bugok{outline:5px solid var(--verde); outline-offset:3px}
.blk.estatico{min-width:200px}
button.blk{font:inherit; font-weight:700}
.simbolo{display:grid; grid-template-columns:120px minmax(0,1fr); gap:14px; align-items:center; background:var(--sup); border:3px solid var(--tinta); border-radius:16px; padding:12px 14px}
.simbolo.cerrado{border-style:dashed; border-color:var(--borde); color:var(--tinta2)}
.forma{display:grid; place-items:center; height:52px; border:3px solid var(--tinta); color:#fff; font-weight:700; font-size:.85rem; font-family:var(--display)}
.forma.ov{border-radius:999px; background:var(--verde)} .forma.re{background:var(--azul)}
.forma.ro{background:var(--amarillo); color:#16263D; transform:rotate(45deg) scale(.6); width:52px; margin:auto}
.forma.pa{background:#9B6BFF; transform:skewX(-18deg)}
.forma.fl{border:0; color:var(--tinta); font-size:2rem}
.bitmini{width:90px}
.pegado{position:sticky; top:90px}
@media (max-width:820px){.pegado{position:static}}

/* Bloques ampliados */
.blk.decision{background:var(--amarillo); color:#16263D; border-radius:4px}
.blk.es{background:#8A5CF0; transform:skewX(-12deg); border-radius:2px}
.blk.es>*{transform:skewX(12deg)}
.blk.bucle{background:var(--naranja); color:#16263D; border-radius:14px 14px 4px 4px; flex-wrap:wrap}
.blk.bucle input[type=number]{flex:0 0 70px}
.blk.decision .handle,.blk.bucle .handle{color:rgba(22,38,61,.7)}
.blk.decision .x,.blk.bucle .x{background:rgba(22,38,61,.15); color:#16263D}
.tagest{font-family:var(--display); font-size:.75rem; background:rgba(255,255,255,.2); border-radius:6px; padding:1px 6px; margin-right:4px}
.blk .tag{font-size:.8rem; font-family:var(--display); font-weight:700; white-space:nowrap; background:rgba(255,255,255,.2); border-radius:6px; padding:2px 6px}
.siempre{display:inline-flex; align-items:center; gap:4px; margin:0; font-size:.9rem}
.ramas{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px; width:100%; max-width:380px; background:var(--sup2); border:3px dashed var(--amarillo-o); border-top:0; border-radius:0 0 12px 12px; padding:8px}
.ramas.una{grid-template-columns:minmax(0,1fr); border-color:var(--naranja)}
.subt{font-family:var(--display); font-weight:700; font-size:.95rem}
.subp{display:flex; gap:4px; margin:4px 0}
.subp input,.stp{flex:1; min-width:0; font:inherit; font-size:.9rem; font-weight:700; border:2px solid var(--tinta); border-radius:4px; padding:4px 8px; background:var(--azul); color:#fff}
.subp input{background:var(--sup); color:var(--tinta); border-color:var(--azul)}
.stp{display:block; margin:4px 0}
.stp select{font:inherit; font-size:.85rem; width:100%; border-radius:4px; border:0; padding:3px}
.subp input.run,.stp.run{outline:4px solid var(--amarillo); outline-offset:2px}
.subp .x{background:var(--sup); color:var(--tinta); border:1px solid var(--borde); border-radius:6px; width:28px; padding:0}
.mini2{font:inherit; font-size:.85rem; background:none; border:2px dashed var(--borde); border-radius:6px; color:var(--tinta2); padding:2px 8px; margin-top:2px}
.btn.pal-decision,.btn.naranja{background:var(--amarillo); color:#16263D}
.btn.pal-entrada,.btn.pal-salida{background:#8A5CF0}
.btn.pal-bucle,.btn.naranja{background:var(--naranja); color:#16263D}
.btn.pal-inicio,.btn.pal-fin{background:var(--verde)}
.btn.act{background:var(--amarillo); color:#16263D}
.ask{margin-top:12px; background:var(--sup); border:3px solid var(--tinta); border-radius:16px; padding:14px}
.bit .l-umb,.bit .l-gafas{display:none} .bit.umb .l-umb{display:inline} .bit.gafas .l-gafas{display:inline}
.scene.lluvia{background:linear-gradient(#8A9AAE 0 64%, #6B737D 64% 70%, #4B535D 70% 100%)}
.scene.lluvia::after{content:""; position:absolute; inset:0; z-index:1; pointer-events:none; background:repeating-linear-gradient(100deg,transparent 0 18px,rgba(58,160,255,.6) 18px 20px); background-size:100% 60px; animation:lluvia .4s linear infinite}
@keyframes lluvia{to{background-position:0 60px}}
.led{width:52px; height:52px; border-radius:50%; border:3px solid var(--tinta); background:#5A1F1F}
.led.on{background:#FF3B3B; box-shadow:0 0 28px #FF3B3B}
.escalera{border:3px solid var(--tinta); border-radius:20px; overflow-x:auto; background:linear-gradient(#CFE8FF,#EAF4FF)}
.escalera svg{display:block; min-width:420px; width:100%}
#rob{transition:transform .16s linear}
#rob.cae{transition:transform .8s ease-in}
.dev{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.pant{background:var(--pantalla); color:var(--ojo); font-family:var(--display); border-radius:14px; padding:14px 16px; min-height:56px; font-size:1.1rem}
@media (max-width:820px){.ramas{max-width:100%}}

/* Constructor guiado */
.bit{transition:transform .25s ease}
.bit.agachado{transform:translateY(30px) scaleY(.86); transform-origin:50% 100%}
.bit .brazo-d{transform-box:view-box; transform-origin:155px 120px; transition:transform .2s}
.bit.saluda .brazo-d{transform:rotate(-150deg)}
.bit.aplaude .brazo-d{transform:rotate(-40deg)}
.contador{position:absolute; right:14px; bottom:12px; z-index:3; background:#16263D; color:#fff; font-family:var(--display); font-weight:700; border-radius:12px; padding:6px 12px; font-size:1.1rem}
.lienzo{border:3px solid var(--tinta); border-radius:20px; overflow:hidden; background:#fff; background-image:linear-gradient(#E6EEF6 1px,transparent 1px),linear-gradient(90deg,#E6EEF6 1px,transparent 1px); background-size:20px 20px}
.lienzo svg{display:block; width:100%; height:auto}
#tort{transition:transform .35s linear}
.blk select{flex:1; font:inherit; font-weight:700; border:0; border-radius:6px; padding:4px 6px; min-width:0; color:#16263D; background:#fff}

/* Misión 6 */
.letras{display:grid; gap:8px}
.letra{display:grid; grid-template-columns:40px auto minmax(0,1fr); gap:12px; align-items:center; background:var(--sup); border:2px solid var(--borde); border-radius:12px; padding:8px 12px}
.letra b{font-family:var(--display); font-size:1.4rem; text-align:center}
.bombillas{display:flex; gap:4px}
.bomb{width:16px; height:16px; border-radius:50%; border:2px solid var(--tinta); background:#3A4250}
.bomb.on{background:#FFC23D; box-shadow:0 0 8px #FFC23D}
.bin{font-family:ui-monospace,Consolas,monospace; letter-spacing:.08em}
.codigo{font-family:ui-monospace,Consolas,"Courier New",monospace; background:#0E1A2B; color:#E7EFF8; border-radius:12px; padding:12px 14px; font-size:.92rem; white-space:pre; overflow-x:auto; margin:6px 0; line-height:1.5}
.codigo .k{color:#FF9E64} .codigo .s{color:#9ECE6A} .codigo .f{color:#7AA2F7}
.nivel{display:grid; grid-template-columns:120px minmax(0,1fr); gap:14px; align-items:center; border:3px solid var(--tinta); border-radius:14px; padding:10px 14px; background:var(--sup); margin-bottom:10px}
.nivel .et{font-family:var(--display); font-weight:700; text-align:center}
.apps{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin:10px 0}
.app{border:3px solid var(--tinta); border-radius:18px; background:var(--sup2); padding:10px 6px; text-align:center; font-weight:700; font-size:.9rem; color:var(--tinta)}
.app span{display:block; font-size:1.8rem}
.escenario{position:relative; border:3px solid var(--tinta); border-radius:20px; min-height:280px; overflow:hidden; background:linear-gradient(#DFF1FF 0 75%, #B9C6D6 75% 100%)}
.actor{position:absolute; bottom:8px; left:50%; width:130px; margin-left:-65px; transition:transform .45s ease}
.actor .bit{width:130px}
.actor.giro .bit{transform:scaleX(-1)}
.escenario .bubble{left:14px}
.tl{display:grid; grid-template-columns:minmax(0,1fr) 130px; gap:10px; align-items:center; font-family:ui-monospace,Consolas,monospace; border-radius:8px; padding:4px 8px}
.tl input{font:inherit; border:2px solid var(--borde); border-radius:8px; padding:6px 8px; background:var(--sup); color:var(--tinta); min-width:0}
.tl.run{background:var(--amarillo); color:#16263D}
.tl.mal{background:#FFD3D4; color:#16263D}
.tl.mal input{border-color:var(--rojo)}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chipc{font-family:ui-monospace,Consolas,monospace; background:var(--sup2); border:2px solid var(--borde); border-radius:999px; padding:2px 10px; font-size:.9rem}
.lang{background:var(--sup); border:3px solid var(--tinta); border-radius:18px; padding:14px}
.lang h3{margin-bottom:6px}
.lang .fila{margin-top:8px}
.lang.ok{border-color:var(--verde)}
.pz{list-style:none; --c:#2F6FEB; background:var(--c); color:#fff; font-family:var(--display); font-weight:600; font-size:.95rem; line-height:1.3; border-radius:8px; padding:6px 10px; margin:6px 0 4px; border:2px solid rgba(0,0,0,.3); display:flex; align-items:center; gap:8px; cursor:grab; position:relative; flex-wrap:wrap}
.pz::before{content:""; position:absolute; left:18px; top:-7px; width:20px; height:7px; background:var(--c); border:2px solid rgba(0,0,0,.3); border-bottom:0; border-radius:4px 4px 0 0}
.pz.lapiz{--c:#149E6C} .pz.avanza,.pz.gira{--c:#2F6FEB}
.pz.rep{--c:#FF8A3D; color:#16263D; flex-direction:column; align-items:stretch}
.pz.rep>.cab{display:flex; align-items:center; gap:8px}
.pz.hat{--c:#E6A800; color:#16263D; border-radius:18px 18px 8px 8px; cursor:default}
.pz.hat::before{display:none}
.pz input,.pz select{font:inherit; font-size:.9rem; width:58px; border:0; border-radius:6px; padding:2px 4px; color:#16263D; background:#fff}
.pz .x{margin-left:auto; background:rgba(0,0,0,.2); color:inherit; border:0; border-radius:6px; width:26px; height:26px; padding:0}
.pzlist{list-style:none; margin:0; padding:0; min-height:40px}
.pz.rep .pzlist{margin:4px 0 4px 10px; padding:4px 6px; background:rgba(255,255,255,.4); border-radius:6px; min-height:44px}
.ws{background:var(--sup2); border:3px dashed var(--borde); border-radius:16px; padding:10px; min-height:220px}
.pz .x{flex:0 0 26px}
.paleta .pz{cursor:copy}
.pz.run{outline:4px solid var(--amarillo); outline-offset:2px}
.tabs-code{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:12px}
@media (max-width:820px){.nivel{grid-template-columns:minmax(0,1fr)} .apps{grid-template-columns:repeat(2,minmax(0,1fr))} .tabs-code{grid-template-columns:minmax(0,1fr)} .tl{grid-template-columns:minmax(0,1fr) 100px}}

/* Misión 7 */
.marcador{position:sticky; top:calc(72px + env(safe-area-inset-top,0px)); z-index:10; display:flex; flex-wrap:wrap; gap:10px; align-items:center; background:var(--tinta); color:var(--papel); border-radius:16px; padding:10px 16px; margin-bottom:18px; font-family:var(--display); font-weight:600}
.marcador b{font-size:1.3rem}
.marcador .sp{flex:1}
.item{background:var(--sup); border:3px solid var(--tinta); border-radius:18px; padding:18px; margin-bottom:16px}
.item.hecho{border-color:var(--verde)}
.item .pts{float:right; font-family:var(--display); font-weight:700; background:var(--sup2); border:2px solid var(--borde); border-radius:999px; padding:2px 10px; font-size:.9rem}
.retocab{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:12px}
.evalua{background:var(--sup2); border-radius:10px; padding:6px 12px; font-size:.95rem}
.codigoRes{font-family:ui-monospace,Consolas,monospace; font-size:2.4rem; font-weight:700; letter-spacing:.12em; background:var(--tinta); color:var(--amarillo); border-radius:16px; padding:10px 20px; display:inline-block}
.barra{height:14px; background:var(--sup2); border:2px solid var(--borde); border-radius:999px; overflow:hidden}
.barra i{display:block; height:100%; background:var(--verde)}
.tabla{width:100%; border-collapse:collapse; font-size:.95rem}
.tabla th,.tabla td{padding:8px 10px; border-bottom:2px solid var(--borde); text-align:left; white-space:nowrap}
.tabla th{font-family:var(--display)}
.tabla tr.nuevo{animation:flash 1.6s}
@keyframes flash{0%,40%{background:var(--amarillo); color:#16263D}}
.scroll{overflow-x:auto}
.podio{display:flex; align-items:flex-end; justify-content:center; gap:14px; margin:10px 0 20px}
.esc{width:30%; max-width:220px; text-align:center}
.esc .nom{font-family:var(--display); font-weight:700; font-size:1.2rem; margin-bottom:6px; overflow:hidden; text-overflow:ellipsis}
.esc .col{border:3px solid var(--tinta); border-bottom:0; border-radius:14px 14px 0 0; display:grid; place-items:center; font-size:2.4rem; animation:sube .6s ease-out}
.esc.p1 .col{height:170px; background:#FFD166} .esc.p2 .col{height:125px; background:#D9E2EC} .esc.p3 .col{height:95px; background:#E8B78A}
@keyframes sube{from{transform:scaleY(.2); transform-origin:bottom}}
body.proyector .solo-profe{display:none!important}
body.proyector .tabla{font-size:1.25rem}
.fila-min{display:flex; gap:10px; flex-wrap:wrap; align-items:end}
.mcard.act{outline:4px solid var(--amarillo); outline-offset:2px}
.fila-min>div{flex:1; min-width:150px}

/* Zona Experta */
.varbox{display:inline-flex; flex-direction:column; align-items:center; border:3px solid var(--tinta); border-radius:12px; overflow:hidden; min-width:110px; background:var(--sup); margin:4px}
.varbox .vn{background:var(--tinta); color:var(--papel); font-family:ui-monospace,Consolas,monospace; font-weight:700; padding:2px 10px; width:100%; text-align:center}
.varbox .vv{font-family:var(--display); font-weight:700; font-size:1.8rem; padding:4px 12px; transition:background .3s}
.varbox .vv.cambia{background:var(--amarillo); color:#16263D}
.pz.fijar,.pz.cambiar{--c:#D94F8A} .pz.decirv,.pz.decirt{--c:#8A5CF0}
.pz input.t{width:110px}
/* Insignia */
.tarjeta{max-width:560px; margin:0 auto; background:var(--sup); border:4px solid var(--tinta); border-radius:24px; padding:26px; text-align:center}
.tarjeta .medalla{width:140px; margin:0 auto 10px}
.tarjeta dl{display:grid; grid-template-columns:auto auto; gap:6px 18px; justify-content:center; text-align:left; margin:16px 0}
.tarjeta dt{color:var(--tinta2)} .tarjeta dd{margin:0; font-weight:700}

/* Formularios */
label{font-weight:700; display:block; margin-bottom:4px}
.campo{font:inherit; width:100%; border:3px solid var(--tinta); border-radius:12px; padding:10px 14px; background:var(--sup); color:var(--tinta)}
.colores{display:flex; gap:12px}
.color{width:48px; height:48px; border-radius:50%; border:3px solid var(--tinta); padding:0}
.color[aria-pressed="true"]{outline:4px solid var(--amarillo); outline-offset:3px}

.toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--tinta); color:var(--papel); font-family:var(--display); font-weight:600; padding:10px 20px; border-radius:999px; z-index:50; font-size:1.1rem}
dialog{border:3px solid var(--tinta); border-radius:20px; background:var(--sup); color:var(--tinta); max-width:440px; width:calc(100% - 32px)}
dialog::backdrop{background:rgba(10,20,35,.55)}
footer{text-align:center; font-size:.85rem; color:var(--tinta2); padding:10px 18px 30px}
.oculto{display:none!important}

@media (max-width:820px){
  .hero,.grid2{grid-template-columns:minmax(0,1fr)}
  .hero .bit{width:150px; margin:auto}
  .grid3{grid-template-columns:minmax(0,1fr)}
  h1,.hero h1{font-size:1.9rem}
  .chip span{display:none}
  .simbolo{grid-template-columns:90px minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
@media print{
  body{background:#fff}
  body *{visibility:hidden}
  #tarjeta,#tarjeta *{visibility:visible}
  #tarjeta{position:absolute; left:0; right:0; top:0; border-color:#000}
}
</style>

 a", "DECISIÓN": "DECISION", "¡Quiero aprender a decidir!": "I want to learn to decide!", "Todo el mundo me mira raro… ¿paraguas con este solazo? 🥵": "Everyone is looking at me funny… an umbrella in this sunshine? 🥵", "¡Menos mal que llevo paraguas! ☂️": "Good thing I've got an umbrella! ☂️", "Con sol, el paraguas no pinta nada: BIT va cargando con él y pasando calor.": "When it's sunny, the umbrella is pointless: BIT carries it around and gets hot.", "Con lluvia el algoritmo funciona… pero solo de casualidad.": "When it rains the algorithm works… but only by chance.", "¿Llueve?": "Is it raining?", "Coger el paraguas": "Take the umbrella", "Ponerse gafas de sol": "Put on sunglasses", "Ir al instituto": "Go to school", "El bloque Decisión": "The Decision block", "Rombo: Decisión": "Diamond: Decision", "Dentro va una": "Inside goes a", "que se responde con": "that is answered with", ". Del rombo salen dos caminos, uno para cada respuesta.": ". Two paths come out of the diamond, one for each answer.", "Reglas del rombo": "Diamond rules", "La pregunta solo puede responderse con SÍ o NO.": "The question can only be answered with YES or NO.", "Siempre tiene dos salidas: SÍ y NO.": "It always has two exits: YES and NO.", "Una rama puede quedarse sin pasos: a veces, si la respuesta es NO, no hay que hacer nada.": "A branch can have no steps: sometimes, if the answer is NO, there's nothing to do.", "Después, los dos caminos se vuelven a juntar y el algoritmo sigue.": "Afterwards, the two paths join again and the algorithm continues.", "🤖 Los robots deciden así todo el rato: «¿Hay un obstáculo delante?» SÍ → girar. NO → seguir recto.": "🤖 Robots decide like this all the time: «Is there an obstacle ahead?» YES → turn. NO → go straight on.", "Ejemplo: salir de casa": "Example: leaving home", "¿Sirve para un rombo?": "Does it work for a diamond?", "Solo valen preguntas que se respondan con SÍ o NO.": "Only questions answered with YES or NO are valid.", "¿Qué hora es?": "What time is it?", "Se responde con una hora, no con SÍ o NO.": "It's answered with a time, not with YES or NO.", "¿Está la batería por debajo del 20 %?": "Is the battery below 20%?", "¿De qué color está el semáforo?": "What colour is the traffic light?", "Se responde con un color. Mejor: «¿Está el semáforo en verde?»": "It's answered with a colour. Better: «Is the traffic light green?»", "¿Hay un obstáculo delante del robot?": "Is there an obstacle in front of the robot?", "No sirve": "Doesn't work", "Cruzar la calle": "Cross the street", "Esperar a que se ponga verde": "Wait until it turns green", "Cruzar corriendo sin mirar": "Run across without looking", "Volver a casa": "Go back home", "Elige…": "Choose…", "Llegar al paso de peatones": "Arrive at the pedestrian crossing", "¿Está el semáforo del peatón en verde?": "Is the pedestrian light green?", "Llegar al instituto": "Arrive at school", "Prueba 1: el paraguas": "Test 1: the umbrella", "Elige el tiempo y ejecuta. Fíjate en qué camino sigue BIT.": "Choose the weather and run. Look at which path BIT follows.", "☀️ Sol": "☀️ Sun", "🌧️ Lluvia": "🌧️ Rain", "▶ Ejecutar": "▶ Run", "Prueba 2: el semáforo": "Test 2: the traffic light", "Ahora completas tú las ramas: elige qué hace BIT si la respuesta es SÍ y qué hace si es NO. Pruébalo con el semáforo en verde y en rojo.": "Now you complete the branches: choose what BIT does if the answer is YES and what it does if it's NO. Try it with the light on green and on red.", "🟢 Verde": "🟢 Green", "🔴 Rojo": "🔴 Red", "Elige una prueba y pulsa Ejecutar.": "Choose a test and press Run.", "☀️ Paraguas con sol": "☀️ Umbrella with sun", "🌧️ Paraguas con lluvia": "🌧️ Umbrella with rain", "🟢 Semáforo en verde bien resuelto": "🟢 Green light solved correctly", "🔴 Semáforo en rojo bien resuelto": "🔴 Red light solved correctly", "Pruebas superadas": "Tests passed", "Cojo la mochila 🎒": "I pick up the backpack 🎒", "¿Llueve?…": "Is it raining?…", "¡SÍ! 🌧️": "YES! 🌧️", "NO. ☀️": "NO. ☀️", "Cojo el paraguas ☂️": "I take the umbrella ☂️", "Me pongo las gafas de sol 😎": "I put on my sunglasses 😎", "Voy al instituto": "I'm going to school", "¡Fin!": "The end!", "Elige un paso para la rama SÍ y otro para la rama NO.": "Choose a step for the YES branch and another for the NO branch.", "Llego al paso de peatones 🚸": "I arrive at the pedestrian crossing 🚸", "¿Está en verde?…": "Is it green?…", "¡SÍ! 🟢": "YES! 🟢", "NO 🔴": "NO 🔴", "BIT cruza con el semáforo en verde. ¡Perfecto! ✅": "BIT crosses with the light on green. Perfect! ✅", "¡Peligro! BIT ha cruzado en rojo y un coche ha frenado de golpe pitando 🚗💨. En la vida real, esto no se prueba nunca.": "Danger! BIT crossed on red and a car braked hard, honking 🚗💨. In real life, never try this.", "El semáforo ya está en verde… ¡y BIT se queda esperando! No cruza nunca y llega tarde. 🐢": "The light is already green… and BIT just keeps waiting! It never crosses and it's late. 🐢", "BIT espera en la acera hasta que se pone verde y después cruza. ¡Bien hecho! ✅": "BIT waits on the pavement until it turns green and then crosses. Well done! ✅", "Cruzar corriendo sin mirar nunca es buena idea, ni siquiera en verde. ⚠️": "Running across without looking is never a good idea, not even on green. ⚠️", "BIT se da la vuelta y vuelve a casa. ¡No llega al instituto! 🏠": "BIT turns around and goes back home. It never gets to school! 🏠", "Llego al instituto 🏫": "I arrive at school 🏫", "Cambia la rama y vuelve a probar.": "Change the branch and try again.", "Constructor: algoritmos que deciden": "Builder: algorithms that decide", "crea un algoritmo con": "create an algorithm with", "al menos una decisión": "at least one decision", ". Cuando BIT llegue al rombo, te hará la pregunta y tú contestarás SÍ o NO. Pruébalo con las dos respuestas.": ". When BIT reaches the diamond, it will ask you the question and you'll answer YES or NO. Try it with both answers.", "Ideas: lavarse los dientes («¿Están limpios?»), desayunar («¿Queda leche?»), salir de casa («¿Tengo las llaves?»).": "Ideas: brushing teeth («Are they clean?»), breakfast («Is there any milk left?»), leaving home («Have I got my keys?»).", "Este reto necesita al menos un bloque de decisión (rombo).": "This challenge needs at least one decision block (diamond).", "BIT ha elegido un camino según tu respuesta. Ejecútalo otra vez y responde lo contrario: verás cómo cambia el recorrido.": "BIT has chosen a path according to your answer. Run it again and give the opposite answer: you'll see how the route changes.", "¿Qué forma tiene el bloque de decisión?": "What shape is the decision block?", "Las decisiones se dibujan con un rombo.": "Decisions are drawn with a diamond.", "¿Cuántas salidas tiene un rombo?": "How many exits does a diamond have?", "Una": "A", "Dos: SÍ y NO": "Two: YES and NO", "Las que quieras": "As many as you want", "Una para SÍ y otra para NO.": "One for YES and another for NO.", "¿Qué pregunta sirve para un rombo?": "Which question works for a diamond?", "¿Qué color te gusta?": "What colour do you like?", "¿Cuántos años tienes?": "How old are you?", "¿Está encendido el LED?": "Is the LED on?", "¿Dónde vives?": "Where do you live?", "Solo sirven preguntas que se respondan con SÍ o NO.": "Only questions answered with YES or NO work.", "¿Cómo se entera BIT de las cosas?": "How does BIT find things out?", "BIT quiere ponerte el despertador, pero no sabe a qué hora entras a clase… y no tiene forma de preguntártelo. Los ordenadores y los robots se comunican con el exterior de dos formas:": "BIT wants to set your alarm clock, but it doesn't know what time you start school… and it has no way of asking you. Computers and robots communicate with the outside world in two ways:", "📥 Entrada": "📥 Input", "Datos que llegan": "Data that comes", ": tú escribes en el teclado, un sensor mide la luz…": ": you type on the keyboard, a sensor measures light…", "📤 Salida": "📤 Output", "Lo que el ordenador": "What the computer", "envía hacia fuera": "sends outside", ": mostrar algo en pantalla, sonar un pitido, mover un motor…": ": showing something on screen, beeping, moving a motor…", "¿Entrada o salida?": "Input or output?", "Clasifica cada dispositivo.": "Classify each device.", "⌨️ Teclado": "⌨️ Keyboard", "🖥️ Pantalla": "🖥️ Screen", "🎤 Micrófono": "🎤 Microphone", "🔊 Altavoz": "🔊 Speaker", "🖱️ Ratón": "🖱️ Mouse", "📡 Sensor de distancia de un robot": "📡 A robot's distance sensor", "Los sensores son los «sentidos» del robot: siempre son entradas.": "Sensors are the robot's «senses»: they are always inputs.", "💡 LED de un robot": "💡 A robot's LED", "⚙️ Motor de un robot": "⚙️ A robot's motor", "Los motores son salidas: el robot actúa sobre el mundo.": "Motors are outputs: the robot acts on the world.", "Pedir la hora de entrada": "Ask for the start time", "Restar 1 hora": "Subtract 1 hour", "Mostrar la hora de despertarse": "Show the wake-up time", "Hora de entrada": "Start time", "El bloque Entrada / Salida": "The Input / Output block", "Paralelogramo: Entrada/Salida": "Parallelogram: Input/Output", "Se usa cuando el algoritmo": "It's used when the algorithm", "un dato (entrada) o": "a piece of data (input) or", "un resultado (salida).": "a result (output).", "📥 Entrada: «Pedir tu nombre», «Leer el sensor de luz».": "📥 Input: «Ask for your name», «Read the light sensor».", "📤 Salida: «Mostrar el resultado», «Encender el LED».": "📤 Output: «Show the result», «Turn on the LED».", "Pruébalo: el despertador de BIT": "Try it: BIT's alarm clock", "¿A qué hora entras a clase? BIT calculará a qué hora tiene que despertarte (una hora antes).": "What time do you start school? BIT will work out what time to wake you up (one hour earlier).", "Dime a qué hora entras y pulsa Ejecutar.": "Tell me what time you start and press Run.", "1. El saludo": "1. The greeting", "BIT te pide tu nombre (entrada) y te saluda (salida).": "BIT asks for your name (input) and greets you (output).", "Pedir tu nombre": "Ask for your name", "Mostrar «Hola, …»": "Show «Hello, …»", "Escribe tu nombre": "Write your name", "2. La calculadora": "2. The calculator", "BIT te pide dos números (entrada), los suma (proceso) y te enseña el resultado (salida).": "BIT asks you for two numbers (input), adds them (process) and shows you the result (output).", "Pedir el número A": "Ask for number A", "Pedir el número B": "Ask for number B", "Sumar A + B": "Add A + B", "Mostrar el resultado": "Show the result", "Escribe el número A": "Write number A", "Escribe el número B": "Write number B", "3. Calculadora con decisiones": "3. Calculator with decisions", "La misma calculadora, pero más lista: antes de sumar comprueba que cada número es entero y está entre 1 y 10. Comprobar los datos se llama validar. Intenta engañarla con 0, 15 o letras.": "The same calculator, but smarter: before adding, it checks that each number is a whole number between 1 and 10. Checking data is called validating. Try to trick it with 0, 15 or letters.", "¿Está A entre 1 y 10?": "Is A between 1 and 10?", "Mostrar «No válido» y volver a pedir ↩": "Show «Not valid» and ask again ↩", "¿Está B entre 1 y 10?": "Is B between 1 and 10?", "Escribe el número A (del 1 al 10)": "Write number A (from 1 to 10)", "Escribe el número B (del 1 al 10)": "Write number B (from 1 to 10)", "BIT pregunta y responde": "BIT asks and answers", "Tu respuesta": "Your answer", "Pulsa Ejecutar para empezar.": "Press Run to start.", "Casi todos los programas siguen este esquema:": "Almost all programs follow this pattern:", "📥 Entrada → ⚙️ Proceso → 📤 Salida": "📥 Input → ⚙️ Process → 📤 Output", ". La calculadora del móvil, un videojuego o un robot: reciben datos, los procesan y responden.": ". A phone calculator, a video game or a robot: they receive data, process it and respond.", "Ejemplos probados": "Examples tried", "🔢 Escribe un número, por ejemplo 7": "🔢 Write a number, for example 7", "no es un número entero": "is not a whole number", "es menor que 1": "is less than 1", "es mayor que 10": "is greater than 10", "· Prueba ahora el otro ejemplo.": "· Now try the other example.", "Constructor: BIT pregunta y responde": "Builder: BIT asks and answers", "haz que BIT te pregunte algo y te conteste. Usa un bloque de": "make BIT ask you something and answer you. Use an", "para pedir el dato y uno de": "block to ask for the data and an", "para mostrarlo. Si escribes": "block to show it. If you write", "en la salida, BIT lo cambiará por lo que le hayas contestado.": "in the output, BIT will replace it with whatever you answered.", "Ejemplo: 📥 «Pedir tu nombre» → 📤 «Hola, [dato], ¡bienvenido a clase!». Después inventa el tuyo: tu comida favorita, tu equipo, tu edad…": "Example: 📥 «Ask for your name» → 📤 «Hello, [dato], welcome to class!». Then make up your own: your favourite food, your team, your age…", "Este reto necesita al menos un bloque de entrada (📥).": "This challenge needs at least one input block (📥).", "Este reto necesita al menos un bloque de salida (📤).": "This challenge needs at least one output block (📤).", "BIT ha recogido tu dato (entrada) y lo ha usado para responderte (salida).": "BIT has collected your data (input) and used it to answer you (output).", "¿Qué forma tiene el bloque de entrada/salida?": "What shape is the input/output block?", "Círculo": "Circle", "Entrada y salida se dibujan con un paralelogramo.": "Input and output are drawn with a parallelogram.", "¿Cuál de estos es un dispositivo de entrada?": "Which of these is an input device?", "Con el teclado metes datos en el ordenador.": "With the keyboard you enter data into the computer.", "En la calculadora de BIT, ¿qué bloque es la salida?": "In BIT's calculator, which block is the output?", "Mostrar el resultado es lo que BIT te devuelve: la salida.": "Showing the result is what BIT gives back to you: the output.", "¡20 escalones!": "20 steps!", "El aula de robótica está en el primer piso. Para subir un escalón, BIT tiene que": "The robotics room is on the first floor. To climb one step, BIT has to", "subir la pierna derecha": "lift its right leg", "y después": "and then", "subir la pierna izquierda": "lift its left leg", ". La escalera tiene 20 escalones.": ". The staircase has 20 steps.", "Sin bucle": "Without a loop", "✍️ Escribir el algoritmo a mano": "✍️ Write the algorithm by hand", "Bloques escritos:": "Blocks written:", "Con bucle": "With a loop", "🔁 Usar un bucle": "🔁 Use a loop", "😩 ¡40 bloques! ¿Y si el instituto tuviera 5 pisos? ¿Y si te equivocas en el bloque 27? Tiene que haber una forma mejor…": "😩 40 blocks! What if the school had 5 floors? What if you make a mistake in block 27? There must be a better way…", "Repetir 20 veces": "Repeat 20 times", "Subir pierna derecha": "Lift right leg", "Subir pierna izquierda": "Lift left leg", "De 40 bloques a 3.": "From 40 blocks to 3.", "Un": "A", "(o estructura de repetición) repite un grupo de pasos las veces que haga falta, sin escribirlos una y otra vez. Los algoritmos quedan más cortos y con menos errores.": "(or repetition structure) repeats a group of steps as many times as needed, without writing them again and again. Algorithms become shorter and have fewer mistakes.", "¡Quiero dominar los bucles!": "I want to master loops!", "Encender la luz": "Turn on the light", "Apagar la luz": "Turn off the light", "Repetir para siempre": "Repeat forever", "Repetir 10 veces": "Repeat 10 times", "Dos tipos de bucle": "Two types of loop", "♾️ Repetir para siempre": "♾️ Repeat forever", "Los pasos se repiten sin parar.": "The steps repeat non-stop.", "No tiene FIN": "It has no END", ": solo se detiene si lo apagas. Ejemplo: la luz de una sirena o de una alarma.": ": it only stops if you switch it off. Example: the light of a siren or an alarm.", "▶ Encender": "▶ Switch on", "■ Apagar": "■ Switch off", "🔢 Repetir un número de veces": "🔢 Repeat a number of times", "Los pasos se repiten las veces que digas y después el algoritmo": "The steps repeat as many times as you say and then the algorithm", "sigue hasta el FIN": "continues to the END", ". Ejemplo: el intermitente que parpadea 10 veces.": ". Example: an indicator that blinks 10 times.", "de 10": "of 10", "✅ Has probado los dos tipos. Recuerda: el bucle": "✅ You've tried both types. Remember: the", "para siempre": "forever", "no llega nunca al FIN; el de": "loop never reaches the END; the", "número de veces": "number of times", ", sí.": " one does.", "Déjalo parpadear un poco más": "Let it blink a bit longer", "Saltar a la pata coja": "Hop on one leg", "Número de repeticiones": "Number of repetitions", "Primer paso": "First step", "Segundo paso": "Second step", "Escalera de 20 escalones": "Staircase of 20 steps", "Programa la subida": "Program the climb", "Configura el bucle para que BIT suba": "Set up the loop so that BIT climbs", "hasta el aula de robótica.": "up to the robotics room.", "Configura el bucle y pulsa Ejecutar.": "Set up the loop and press Run.", "Escalón:": "Step:", "de 20 · Vueltas del bucle:": "of 20 · Loop laps:", "🔎 Cada vuelta del bucle debería subir un escalón completo: las dos piernas, una detrás de otra.": "🔎 Each lap of the loop should climb one whole step: both legs, one after the other.", "🔎 Si cada vuelta sube 1 escalón, ¿cuántas vueltas hacen falta para 20 escalones?": "🔎 If each lap climbs 1 step, how many laps do you need for 20 steps?", "No quedan más pistas": "No hints left", "El bucle está vacío: BIT repite «nada» una y otra vez y no se mueve. 😐": "The loop is empty: BIT repeats «nothing» over and over and doesn't move. 😐", "Pon un número de repeticiones.": "Set a number of repetitions.", "Levanto una pierna…": "I lift a leg…", "BIT sube a la pata coja… ¡y se agota en el escalón 8! 🥵 Mejor usar las dos piernas.": "BIT hops on one leg… and runs out of energy on step 8! 🥵 Better to use both legs.", "Levanto la pierna… ¡aquí ya no hay escalón!": "I lift my leg… there's no step here!", "Con «para siempre» el bucle no termina nunca: BIT ha llegado arriba, pero sigue levantando piernas en el rellano sin parar 🔁😵. Para una escalera necesitas un número exacto de repeticiones.": "With «forever» the loop never ends: BIT has reached the top, but keeps lifting its legs on the landing non-stop 🔁😵. For a staircase you need an exact number of repetitions.", "¡He llegado al aula de robótica! 🎉": "I've reached the robotics room! 🎉", "¡Perfecto!": "Perfect!", "20 vueltas × 2 pasos = 40 movimientos, escritos con solo 3 bloques (el bucle y sus dos pasos).": "20 laps × 2 steps = 40 movements, written with only 3 blocks (the loop and its two steps).", "🏋️ Reto 1: sentadillas": "🏋️ Challenge 1: squats", "El entrenador pide a BIT": "The coach asks BIT for", "y, al terminar, que": "and, when it finishes, to", "a la clase.": "the class.", "🔎 Una sentadilla son dos acciones: agacharse y después levantarse.": "🔎 A squat is two actions: crouch down and then stand up.", "🔎 Cada vuelta del bucle hace una sentadilla. ¿Cuántas vueltas necesitas para 10? Y el saludo… ¿dentro o fuera del bucle?": "🔎 Each lap of the loop does one squat. How many laps do you need for 10? And the wave… inside or outside the loop?", "⬛ Reto 2: el cuadrado": "⬛ Challenge 2: the square", "BIT lleva un lápiz. Haz que dibuje un": "BIT is carrying a pencil. Make it draw a perfect", "perfecto: 4 lados iguales que se cierran justo donde empezó.": ": 4 equal sides that close exactly where it started.", "Avanzar 100 pasos": "Move forward 100 steps", "Girar 90° a la derecha": "Turn 90° to the right", "Girar 120° a la derecha": "Turn 120° to the right", "Girar 60° a la derecha": "Turn 60° to the right", "Bajar el lápiz ✏️": "Put the pencil down ✏️", "🔎 Un cuadrado tiene 4 lados iguales y 4 esquinas en ángulo recto (90°).": "🔎 A square has 4 equal sides and 4 right-angled corners (90°).", "🔎 Cada vuelta del bucle debería dibujar un lado y girar en la esquina.": "🔎 Each lap of the loop should draw one side and turn at the corner.", "¡Listo para entrenar!": "Ready to train!", "Lienzo de dibujo": "Drawing canvas", "Pulsa Ejecutar y mira qué dibuja BIT.": "Press Run and see what BIT draws.", "Primera acción": "First action", "Segunda acción": "Second action", "Acción final": "Final action", "🎉 ¡Los dos retos guiados superados! Ahora pasa al": "🎉 Both guided challenges completed! Now go to the", "reto 2: el cuadrado": "challenge 2: the square", "reto 1: las sentadillas": "challenge 1: the squats", "¡BIT ya está agachado y no puede bajar más! 😵 Revisa el orden: después de agacharse tiene que levantarse.": "BIT is already crouching and can't go any lower! 😵 Check the order: after crouching it has to stand up.", "BIT ya está de pie… ¡no puede levantarse otra vez! 🤔 Primero tiene que agacharse.": "BIT is already standing… it can't stand up again! 🤔 First it has to crouch.", "👏 ¡Clap!": "👏 Clap!", "El bucle está vacío: BIT se queda quieto esperando órdenes. 😐": "The loop is empty: BIT stands still waiting for orders. 😐", "¡BIT se ha quedado agachado! 🦵 Le falta levantarse en cada vuelta.": "BIT is stuck crouching! 🦵 It needs to stand up on each lap.", "Después:": "Afterwards:", "Las 10 sentadillas están perfectas, pero BIT no ha saludado al terminar. ¿Qué bloque falta después del bucle?": "The 10 squats are perfect, but BIT didn't wave at the end. Which block is missing after the loop?", "BIT ha saludado en cada sentadilla. El saludo va fuera del bucle, solo una vez al final.": "BIT waved on every squat. The wave goes outside the loop, only once at the end.", "¡10 sentadillas y un saludo! 💪👋": "10 squats and a wave! 💪👋", "¡Reto superado!": "Challenge completed!", "Con un bucle de 2 acciones repetido 10 veces, BIT ha hecho 20 movimientos. Y el saludo fuera del bucle solo se hace una vez.": "With a 2-action loop repeated 10 times, BIT has done 20 movements. And the wave outside the loop only happens once.", "El bucle está vacío: BIT no se mueve y la hoja sigue en blanco.": "The loop is empty: BIT doesn't move and the sheet stays blank.", "BIT solo gira sobre sí mismo: sin avanzar, el lápiz no dibuja nada. 🌀": "BIT only spins on the spot: without moving forward, the pencil draws nothing. 🌀", "BIT avanza siempre en línea recta… ¡y se sale de la hoja! Le falta girar en cada esquina.": "BIT always goes in a straight line… and goes off the page! It needs to turn at each corner.", "un triángulo": "a triangle", "un hexágono": "a hexagon", "parte de": "part of", "¡Cuadrado perfecto! ⬛🎉": "Perfect square! ⬛🎉", "4 vueltas de «avanzar y girar 90°». Así se dibuja con el lápiz de Scratch, que verás en la próxima unidad.": "4 laps of «move forward and turn 90°». That's how you draw with the Scratch pen, which you'll see in the next unit.", "Reto 3: constructor libre": "Challenge 3: free builder", "Ahora sin dibujos: usa tu imaginación.": "Now without drawings: use your imagination.", "Inventa una acción que se repita, escribe los pasos y BIT te los irá narrando. Tu algoritmo necesita": "Invent an action that repeats, write the steps and BIT will narrate them to you. Your algorithm needs", "al menos un bucle": "at least one loop", ": elige cuántas veces se repite o marca «siempre» (entonces no lleva FIN y tendrás que pararlo tú).": ": choose how many times it repeats or tick «forever» (then it has no END and you'll have to stop it yourself).", "Ideas: BIT riega 5 macetas seguidas, un semáforo que cambia de color para siempre, un jugador que bota el balón 20 veces antes de tirar a canasta, un robot aspirador que avanza y gira hasta limpiar la habitación.": "Ideas: BIT waters 5 plant pots in a row, a traffic light that changes colour forever, a player who bounces the ball 20 times before shooting, a robot vacuum cleaner that moves and turns until the room is clean.", "Este reto necesita al menos un bucle (🔁 Repetir).": "This challenge needs at least one loop (🔁 Repeat).", "BIT ha repetido los pasos del bucle sin que tuvieras que escribirlos una y otra vez.": "BIT has repeated the loop steps without you having to write them again and again.", "¿Para qué sirve un bucle?": "What is a loop for?", "Para tomar decisiones": "To make decisions", "Para repetir pasos sin escribirlos muchas veces": "To repeat steps without writing them many times", "Para pedir datos": "To ask for data", "Para terminar el algoritmo": "To end the algorithm", "Los bucles repiten un grupo de pasos y acortan los algoritmos.": "Loops repeat a group of steps and make algorithms shorter.", "Un bucle «para siempre»…": "A «forever» loop…", "Termina después de 10 vueltas": "Ends after 10 laps", "No tiene FIN: se repite hasta que lo apagas": "Has no END: it repeats until you switch it off", "Solo se usa en Scratch": "Is only used in Scratch", "Es un error": "Is a mistake", "El bucle para siempre no llega nunca al FIN.": "The forever loop never reaches the END.", "Para subir 20 escalones repitiendo «pierna derecha, pierna izquierda», ¿cuántas veces se repite el bucle?": "To climb 20 steps repeating «right leg, left leg», how many times does the loop repeat?", "Cada vuelta sube un escalón, así que hacen falta 20 vueltas.": "Each lap climbs one step, so you need 20 laps.", "Orden para BIT": "Order for BIT", "BIT no entiende español": "BIT doesn't understand English", "Escribe una orden para BIT y envíasela. Vamos a ver qué le llega a su cerebro electrónico.": "Write an order for BIT and send it. Let's see what reaches its electronic brain.", "Enviar a BIT": "Send to BIT", "Escríbeme algo…": "Write me something…", "… 😵 ¿Esto qué es?": "… 😵 What is this?", "Dentro de un ordenador solo hay electricidad:": "Inside a computer there's only electricity:", "no pasa (0)": "no current (0)", ", como una bombilla encendida o apagada. Cada letra que escribes se convierte en 8 ceros y unos. Eso es lo único que entiende la máquina: el": ", like a light bulb that's on or off. Every letter you type becomes 8 zeros and ones. That's the only thing the machine understands: the", "lenguaje máquina": "machine language", "Entonces… ¿cómo le hablamos?": "So… how do we talk to it?", "1. Un programa son muchos algoritmos": "1. A program is many algorithms", "Durante la unidad has creado algoritmos sueltos. Si los juntas en una sola aplicación, tienes un": "During the unit you've created separate algorithms. If you put them together in one app, you have a", ": la «app de BIT».": ": the «BIT app».", "Cualquier app de tu móvil funciona igual: son cientos o miles de algoritmos trabajando juntos.": "Every app on your phone works the same way: hundreds or thousands of algorithms working together.", "2. Los niveles de los lenguajes": "2. The levels of languages", "La misma orden, «avanza 100 pasos», escrita en tres niveles:": "The same order, «move forward 100 steps», written at three levels:", "🧩 Alto nivel": "🧩 High level", "avanzar 100 pasos": "move forward 100 steps", "📝 Alto nivel": "📝 High level", "⚙️ Bajo nivel": "⚙️ Low level", "máquina": "machine", "Cuanto más": "The", "es el nivel, más fácil es para las personas. Cuanto más": "the level, the easier it is for people. The", ", más cerca está de la máquina.": ", the closer it is to the machine.", "3. El traductor: compilador o intérprete": "3. The translator: compiler or interpreter", "Nosotros programamos en alto nivel, pero la máquina solo entiende ceros y unos. Alguien tiene que traducir. Hay dos tipos de traductores:": "We program in high-level languages, but the machine only understands zeros and ones. Someone has to translate. There are two types of translators:", "Como el traductor de un libro: traduce": "Like a book translator: it translates", "el programa entero": "the whole program", "antes de usarlo. Si encuentra un error, no se ejecuta nada hasta que lo arregles.": "before using it. If it finds an error, nothing runs until you fix it.", "Intérprete": "Interpreter", "Como un intérprete en una conversación: traduce y ejecuta": "Like an interpreter in a conversation: it translates and runs", "línea a línea": "line by line", ". Si encuentra un error, se para justo ahí.": ". If it finds an error, it stops right there.", "Una app del móvil es un programa formado por muchos algoritmos.": "A phone app is a program made of many algorithms.", "El ordenador entiende directamente el español.": "The computer directly understands English.", "Solo entiende ceros y unos: hay que traducírselo.": "It only understands zeros and ones: it has to be translated.", "Python es un lenguaje de alto nivel.": "Python is a high-level language.", "Un compilador traduce el programa línea a línea mientras se ejecuta.": "A compiler translates the program line by line while it runs.", "Eso lo hace el intérprete. El compilador lo traduce todo antes.": "That's what the interpreter does. The compiler translates everything first.", "Compilador contra intérprete": "Compiler versus interpreter", "Este es el programa de BIT, escrito en alto nivel. Ejecútalo con cada traductor, primero sin errores y después con un error.": "This is BIT's program, written in a high-level language. Run it with each translator, first without errors and then with an error.", "Órdenes que BIT conoce:": "Orders BIT knows:", "🐞 Meter un error": "🐞 Add an error", "🔧 Arreglar el programa": "🔧 Fix the program", "🏭 Compilar y ejecutar": "🏭 Compile and run", "🗣️ Interpretar": "🗣️ Interpret", "Elige un traductor.": "Choose a translator.", "🏭 Compilador sin errores": "🏭 Compiler without errors", "🏭 Compilador con un error": "🏭 Compiler with an error", "🗣️ Intérprete sin errores": "🗣️ Interpreter without errors", "🗣️ Intérprete con un error": "🗣️ Interpreter with an error", "¿Has visto la diferencia? Con errores, el": "Did you see the difference? With errors, the", "no deja hacer nada, y el": "doesn't let anything happen, and the", "intérprete": "interpreter", "hace todo lo que puede hasta que tropieza.": "does everything it can until it trips up.", "Línea 4: «avansar» 🐞": "Line 4: «forwrd» 🐞", "Avanzo ➡️": "Moving forward ➡️", "Retrocedo ⬅️": "Moving back ⬅️", "Me giro ↩️": "Turning around ↩️", "¡Salto! 🦘": "Jump! 🦘", "¡Hola, clase! 👋": "Hello, class! 👋", "🏭 Compilando todo el programa…": "🏭 Compiling the whole program…", "❌ Error de compilación. No ejecuto nada.": "❌ Compilation error. I won't run anything.", "no ha hecho nada": "hasn't done anything", ". Arregla el error y vuelve a compilar.": ". Fix the error and compile again.", "✅ Traducido sin errores. ¡Ejecuto!": "✅ Translated without errors. Running!", "El compilador tradujo": "The compiler translated", "todo el programa": "the whole program", "y después BIT lo ejecutó de principio a fin.": "and then BIT ran it from start to finish.", "Fíjate: BIT": "Look: BIT", "sí ha hecho": "has done", "las órdenes anteriores, porque el intérprete traduce y ejecuta línea a línea.": "the previous orders, because the interpreter translates and runs line by line.", "El intérprete ha ido": "The interpreter has gone", ": traduce una, la ejecuta, y pasa a la siguiente.": ": it translates one, runs it, and moves on to the next.", "Lenguaje máquina": "Machine language", "Ceros y unos: lo único que entiende directamente el procesador.": "Zeros and ones: the only thing the processor understands directly.", "Es texto, pero cada instrucción es casi una orden directa al procesador. Muy difícil para personas.": "It's text, but each instruction is almost a direct order to the processor. Very hard for people.", "\"¡Hola, clase!\"": "\"Hello, class!\"", "Uno de los lenguajes de texto más usados para aprender, y también en inteligencia artificial.": "One of the most used text languages for learning, and also in artificial intelligence.", "Muy usado en aplicaciones Android y en empresas.": "Widely used in Android apps and in companies.", "<h1>¡Hola, clase!</h1>": "<h1>Hello, class!</h1>", "Ojo: HTML es un lenguaje de": "Careful: HTML is a", ", no de programación. Describe cómo es una página web, pero no toma decisiones ni repite cosas. Para darle vida se usa JavaScript.": " language, not a programming language. It describes what a web page looks like, but it doesn't make decisions or repeat things. JavaScript is used to bring it to life.", "Se usa para programar placas y robots: esta línea enciende un LED.": "It's used to program boards and robots: this line turns on an LED.", "al empezar": "on start", "decir «¡Hola, clase!»": "say «Hello, class!»", "Truco: MakeCode tiene un botón para cambiar de bloques a JavaScript o Python. ¡El mismo programa, en bloques y en texto!": "Tip: MakeCode has a button to switch from blocks to JavaScript or Python. The same program, in blocks and in text!", "cuando se ejecute": "when run", "repetir 4 veces": "repeat 4 times", "Se programa arrastrando bloques, como un puzle. También deja ver el código de texto que generan los bloques.": "You program by dragging blocks, like a puzzle. It also lets you see the text code the blocks generate.", "al hacer clic": "when clicked", "decir «¡Hola!»": "say «Hello!»", "Lenguaje de bloques muy popular para empezar a programar.": "Very popular block language to start programming.", "Clasifica los lenguajes": "Classify the languages", "Mira cómo se ve cada lenguaje y responde: ¿es de": "Look at what each language looks like and answer: is it", "o de": "or", "? Y si es de alto nivel, ¿se programa con": "? And if it's high level, is it programmed with", "o con": "or with", "🧩 Bloques": "🧩 Blocks", "📝 Texto": "📝 Text", "❌ Revisa tu respuesta.": "❌ Check your answer.", "⬛ Reto 1: cuadrado": "⬛ Challenge 1: square", "⬠ Reto 2: pentágono": "⬠ Challenge 2: pentagon", "pentágono": "pentagon", "Así se programa en": "This is how you program in", "y otras plataformas de bloques: arrastras piezas como en un puzle y las encajas. Coge bloques de la paleta, suéltalos debajo de": "and other block platforms: you drag pieces like a puzzle and snap them together. Take blocks from the palette, drop them under", "y mete dentro de": "and put inside", "los que quieras repetir. Después pulsa": "the ones you want to repeat. Then press", "Quitar bloque": "Remove block", "Veces": "Times", "Programa a BIT para que dibuje un": "Program BIT to draw a", "Arrastra los bloques o púlsalos para añadirlos. Si pulsas dentro de un «repetir», los siguientes bloques irán ahí dentro.": "Drag the blocks or click them to add them. If you click inside a «repeat», the next blocks will go inside it.", "▶ al empezar": "▶ on start", "Monta tu programa y pulsa Ejecutar.": "Build your program and press Run.", "✏️ Bajo el lápiz": "✏️ Pencil down", "Avanzo 100 pasos": "Moving forward 100 steps", "un pentágono": "a pentagon", "un cuadrado": "a square", "una estrella": "a star", "El programa está vacío: añade bloques debajo de «al empezar».": "The program is empty: add blocks under «on start».", "BIT no se ha movido: le falta el bloque «avanzar».": "BIT hasn't moved: it's missing the «move forward» block.", "BIT se ha movido, pero la hoja sigue en blanco: ¡falta bajar el lápiz!": "BIT has moved, but the sheet is still blank: you need to put the pencil down!", "BIT va en línea recta y se sale de la hoja: le falta girar en cada esquina.": "BIT goes in a straight line and goes off the page: it needs to turn at each corner.", "Has usado giros diferentes: en una figura regular todas las esquinas giran lo mismo.": "You've used different turns: in a regular shape all the corners turn the same.", "¡Lo he dibujado! 🎉": "I've drawn it! 🎉", "El mismo programa en texto": "The same program in text", "Muchas plataformas de bloques, como MakeCode, dejan ver este código con un solo clic: los bloques son solo otra forma de escribirlo.": "Many block platforms, like MakeCode, let you see this code with a single click: blocks are just another way of writing it.", "🔍 ¿Ves la regla?": "🔍 Can you see the rule?", "Cuadrado: 4 repeticiones × 90° = 360°": "Square: 4 repetitions × 90° = 360°", "Pentágono: 5 repeticiones × 72° = 360°": "Pentagon: 5 repetitions × 72° = 360°", "una vuelta completa (360°)": "one full turn (360°)", ". Para cualquier figura regular:": ". For any regular shape:", "ángulo = 360° ÷ número de lados": "angle = 360° ÷ number of sides", ". ¿Te atreves con un hexágono?": ". Dare to try a hexagon?", "reto 2: el pentágono. Pista: ¿cambian las repeticiones y el ángulo?": "challenge 2: the pentagon. Hint: do the repetitions and the angle change?", "reto 1: el cuadrado": "challenge 1: the square", "El lenguaje máquina está formado por…": "Machine language is made of…", "Palabras en inglés": "English words", "Ceros y unos": "Zeros and ones", "Bloques de colores": "Coloured blocks", "La máquina solo entiende 0 (no pasa corriente) y 1 (pasa corriente).": "The machine only understands 0 (no current) and 1 (current flows).", "¿Qué hace un compilador?": "What does a compiler do?", "Traduce todo el programa antes de ejecutarlo": "It translates the whole program before running it", "Traduce y ejecuta línea a línea": "It translates and runs line by line", "Dibuja diagramas de flujo": "It draws flowcharts", "Enciende el ordenador": "It switches on the computer", "El compilador lo traduce todo antes; el intérprete va línea a línea.": "The compiler translates everything first; the interpreter goes line by line.", "¿Cuál de estos lenguajes es de bloques?": "Which of these languages is a block language?", "MakeCode Arcade, Code.org o Scratch se programan con bloques.": "MakeCode Arcade, Code.org or Scratch are programmed with blocks.", "Orden exprés": "Express order", "Qué es un algoritmo y sus reglas de oro (Misión 1)": "What an algorithm is and its golden rules (Mission 1)", "Símbolos y lectura de diagramas de flujo (Misiones 2, 3 y 4)": "Symbols and reading flowcharts (Missions 2, 3 and 4)", "El robot aspirador": "The robot vacuum cleaner", "Estructuras de decisión (Misión 3)": "Decision structures (Mission 3)", "¿Qué dirá BIT?": "What will BIT say?", "Entrada, proceso y salida de datos (Misión 4)": "Data input, process and output (Mission 4)", "Figura final": "Final shape", "Bucles, programación por bloques y lenguajes (Misiones 5 y 6)": "Loops, block programming and languages (Missions 5 and 6)", "🏆 La gran competición": "🏆 The great competition", "Esta es la": "This is the", "Situación de Aprendizaje": "Learning Situation", "de la unidad:": "of the unit:", "para demostrar todo lo que has aprendido con BIT.": "to show everything you've learnt with BIT.", "Cada reto vale": "Each challenge is worth", "10 puntos": "10 points", ". Tu": ". Your", "nota de la SdA": "final project mark", "es la media de los 5 retos y depende solo de lo bien que los resuelvas,": "is the average of the 5 challenges and depends only on how well you solve them,", "no del tiempo": "not on time", "En las preguntas de opción múltiple solo hay": "In multiple-choice questions there is only", "un intento": "one try", ". En los retos prácticos puedes probar varias veces, pero cada fallo resta.": ". In the practical challenges you can try several times, but each mistake takes points off.", "Cuando entregas un reto,": "Once you submit a challenge,", "no puedes volver atrás": "you can't go back", "El cronómetro no se para aunque salgas de la página. El tiempo solo cuenta para el": "The timer doesn't stop even if you leave the page. Time only counts for the", "ranking de la clase": "class ranking", ": ganas un bonus si terminas rápido.": ": you get a bonus if you finish quickly.", "Al final tendrás un": "At the end you'll get a", "código": "code", ". Díselo a tu profesor junto con tu nombre.": ". Tell it to your teacher together with your name.", "Solo cuenta tu": "Only your", ". Después puedes entrenar todas las veces que quieras.": " counts. After that you can practise as many times as you like.", "En pareja:": "In pairs:", "cada vez que resolváis un apartado, marcad": "every time you solve a section, mark", "quién lo ha descifrado primero": "who worked it out first", ". Quien lo descifra se lleva sus puntos completos y su compañero el": ". Whoever works it out gets the full points and their partner gets", ". Si lo desci e tiene que hacer BIT antes de cualquier otra cosa?": "🔎 Quelle est la toute première chose que BIT doit faire avant tout le reste ?", "🔎 Piensa en tus pies: ¿qué va antes, los calcetines o las zapatillas? ¿Y la ducha, antes o después de vestirse?": "🔎 Pense à tes pieds : qu'est-ce qui vient d'abord, les chaussettes ou les baskets ? Et la douche, avant ou après s'être habillé ?", "🔎 Si te lavas los dientes y luego desayunas… ¿cómo quedan tus dientes? ¿Y qué debe ser lo último de todo?": "🔎 Si tu te brosses les dents puis tu prends le petit-déjeuner… comment sont tes dents ? Et quelle doit être la toute dernière étape ?", "Ordena la mañana de BIT": "Ordonne la matinée de BIT", "Arrastra las tarjetas (desde ⠿) o usa las flechas para ponerlas en orden. Después pulsa": "Fais glisser les cartes (depuis ⠿) ou utilise les flèches pour les mettre dans l'ordre. Puis appuie sur", ": BIT hará": ": BIT fera", "lo que pongas… aunque sea un desastre.": "ce que tu as mis… même si c'est une catastrophe.", "▶ Ejecutar algoritmo": "▶ Exécuter l'algorithme", "💡 Pista (−5 XP)": "💡 Indice (−5 XP)", "🔀 Mezclar": "🔀 Mélanger", "Estoy listo. Dime qué hago, paso a paso.": "Je suis prêt. Dis-moi quoi faire, étape par étape.", "Ya no quedan más pistas": "Il n'y a plus d'indices", "¡BIT ha salido de casa sin la mochila! 🎒 Ha tenido que volver a por ella y llega tarde.": "BIT est parti sans son sac à dos ! 🎒 Il a dû retourner le chercher et il est en retard.", "¡BIT se ha duchado vestido! 💦 Ahora va empapado al instituto.": "BIT s'est douché tout habillé ! 💦 Il va au collège trempé.", "¡BIT se ha puesto los calcetines por encima de las zapatillas! 🧦👟 Todo el instituto se está riendo.": "BIT a mis ses chaussettes par-dessus ses baskets ! 🧦👟 Tout le collège se moque de lui.", "BIT se lavó los dientes antes de desayunar… ¡y ahora tiene restos de cereales en la boca! 🥣": "BIT s'est brossé les dents avant le petit-déjeuner… et maintenant il a des céréales plein la bouche ! 🥣", "¡Ups! 😵": "Oups ! 😵", e?": "行人信号灯是绿灯吗？", "Llegar al instituto": "到达学校", "Prueba 1: el paraguas": "测试 1：雨伞", "Elige el tiempo y ejecuta. Fíjate en qué camino sigue BIT.": "选择天气并运行。看看 BIT 走哪条路。", "☀️ Sol": "☀️ 晴天", "🌧️ Lluvia": "🌧️ 雨天", "▶ Ejecutar": "▶ 运行", "Prueba 2: el semáforo": "测试 2：红绿灯", "Ahora completas tú las ramas: elige qué hace BIT si la respuesta es SÍ y qué hace si es NO. Pruébalo con el semáforo en verde y en rojo.": "现在由你来完成分支：选择回答「是」时 BIT 做什么，回答「否」时做什么。分别用绿灯和红灯试一试。", "🟢 Verde": "🟢 绿灯", "🔴 Rojo": "🔴 红灯", "Elige una prueba y pulsa Ejecutar.": "选择一个测试，然后点击运行。", "☀️ Paraguas con sol": "☀️ 晴天带伞", "🌧️ Paraguas con lluvia": "🌧️ 雨天带伞", "🟢 Semáforo en verde bien resuelto": "🟢 绿灯情况正确", "🔴 Semáforo en rojo bien resuelto": "🔴 红灯情况正确", "Pruebas superadas": "已通过的测试", "Cojo la mochila 🎒": "我拿上书包 🎒", "¿Llueve?…": "下雨了吗？……", "¡SÍ! 🌧️": "是！🌧️", "NO. ☀️": "否。☀️", "Cojo el paraguas ☂️": "我带上伞 ☂️", "Me pongo las gafas de sol 😎": "我戴上太阳镜 😎", "Voy al instituto": "我去学校", "¡Fin!": "结束！", "Elige un paso para la rama SÍ y otro para la rama NO.": "为「是」分支选一个步骤，再为「否」分支选一个。", "Llego al paso de peatones 🚸": "我走到人行横道 🚸", "¿Está en verde?…": "是绿灯吗？……", "¡SÍ! 🟢": "是！🟢", "NO 🔴": "否 🔴", "BIT cruza con el semáforo en verde. ¡Perfecto! ✅": "BIT 在绿灯时过马路。完美！✅", "¡Peligro! BIT ha cruzado en rojo y un coche ha frenado de golpe pitando 🚗💨. En la vida real, esto no se prueba nunca.": "危险！BIT 闯红灯过马路，一辆车急刹车并按喇叭 🚗💨。现实生活中千万不要这样做。", "El semáforo ya está en verde… ¡y BIT se queda esperando! No cruza nunca y llega tarde. 🐢": "已经是绿灯了……BIT 却还在等！它一直不过马路，结果迟到了。🐢", "BIT espera en la acera hasta que se pone verde y después cruza. ¡Bien hecho! ✅": "BIT 在人行道上等到绿灯，然后过马路。做得好！✅", "Cruzar corriendo sin mirar nunca es buena idea, ni siquiera en verde. ⚠️": "不看路跑过马路从来都不是好主意，绿灯也不行。⚠️", "BIT se da la vuelta y vuelve a casa. ¡No llega al instituto! 🏠": "BIT 转身回家了。它永远到不了学校！🏠", "Llego al instituto 🏫": "我到学校了 🏫", "Cambia la rama y vuelve a probar.": "修改分支后再试一次。", "Constructor: algoritmos que deciden": "搭建器：会做判断的算法", "crea un algoritmo con": "创 const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function gastar(n){ S.xp=Math.max(0,S.xp-n); save(); barra() }
function done(m,f){ if(S.m[m].done[f])return; S.m[m].done[f]=true; save(); const i=(FASES[m]||[]).findIndex(x=>x.id===f); const b=$$('.pasos button')[i]; if(b){b.classList.add('hecho');b.querySelector('.n').textContent='✓'} }
function mXP(m){ return Object.entries(S.awarded).filter(([k])=>k.startsWith('m'+m+'-')).reduce((a,[,v])=>a+v,0) }

function render(){
  {const sl=document.getElementById('lang');if(sl&&sl.value!==LANG)sl.value=LANG;if(window._lastLang!==LANG){window._lastLang=LANG;traducirEstatico()}}
  barra();

function estadoMision(m){
  if(!m.abierta) return 'cerrada';
  if(S.badges[m.n]) return 'hecha';
  return 'abierta';
}

    $('#p1').focus();$('#pg').onclick=()=>{const a=$('#p1').value,b2=$('#p2').value;if(!pinOK(a)){$('#pe').innerHTML='<div class="nota mal">El PIN tiene que tener 4 cifras.</div>';return}if(a!==b2){$('#pe').innerHTML='<div class="nota mal">Los dos PIN no coinciden.</div>';return}

    const ok=()=>{if(hpin($('#pp').value)===p.pin){entrar(p.id);ir('home')}else{$('#pe').innerHTML='<div class="nota mal">PIN incorrecto.</div>';$('#pp').value='';$('#pp').focus()}};

/* ================= DIAGRAMAS ESTÁTICOS ================= */
function flowEst(items){
  return `<ol class="flow">${items.map((it,i)=>{
    if(it.k==='decision') return `<li><div class="blk decision estatico" data-p="${i}">◆ ${it.t}</div><div class="ramas">${['si','no'].map(r=>`<div class="sub"><div class="subt">${r==='si'?'SÍ':'NO'}</div>${(it[r]||[]).map((x,j)=>`<div class="stp" data-p="${i}-${r}-${j}">${x}</div>`).join('')||'<div class="muted" style="font-size:.85rem">(nada)</div>'}</div>`).join('')}</div></li>`;
    if(it.k==='bucle') return `<li><div class="blk bucle estatico" data-p="${i}">🔁 ${it.t}</div><div class="ramas una"><div class="sub"><div class="subt">Se repite:</div>${it.cuerpo.map((x,j)=>`<div class="stp" data-p="${i}-c-${j}">${x}</div>`).join('')}</div></div></li>`;
    const cls={inicio:'inicio',fin:'fin',proceso:'proceso',entrada:'es',salida:'es'}[it.k];
    const t=it.t||(it.k==='inicio'?'INICIO':'FIN');
    return `<li><div class="blk ${cls} estatico" data-p="${i}"><span>${it.k==='entrada'?'<small class="tagest">📥 ENTRADA</small> ':it.k==='salida'?'<small class="tagest">📤 SALIDA</small> ':''}${t}</span></div></li>`}).join('')}</ol>`}
function marca(root,p){root.querySelectorAll('.run').forEach(x=>x.classList.remove('run')); if(p!=null){const e=root.querySelector(`[data-p="${p}"]`); if(e)e.classList.add('run')}}
function sacude(sc){sc.classList.remove('shake','feliz');void sc.offsetWidth;sc.classList.add('shake')}
