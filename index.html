<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="author" content="Manuel Martín Soriano">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Academia de Robots · Unidad 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
<style>
:root{
  --papel:#F2F7FB; --rejilla:#DDE8F1; --tinta:#16263D; --tinta2:#4B5D76;
  --sup:#FFFFFF; --sup2:#E9F1F8; --borde:#C5D4E2;
  --azul:#2F6FEB; --azul-o:#1D4FB8; --verde:#149E6C; --verde-o:#0C7650;
  --amarillo:#FFC23D; --amarillo-o:#D99A10; --rojo:#E0474C; --naranja:#FF8A3D;
  --bitc:#2F6FEB; --pantalla:#0E1A2B; --ojo:#7EF0C1;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --texto:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --papel:#0E1826; --rejilla:#172638; --tinta:#E7EFF8; --tinta2:#A7B8CC;
    --sup:#15243A; --sup2:#1B2E47; --borde:#2B4260; --pantalla:#050B14;
  }
}
:root[data-theme="dark"]{
  --papel:#0E1826; --rejilla:#172638; --tinta:#E7EFF8; --tinta2:#A7B8CC;
  --sup:#15243A; --sup2:#1B2E47; --borde:#2B4260; --pantalla:#050B14;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; min-height:100%; color:var(--tinta); font-family:var(--texto); font-size:18px; line-height:1.55;
  background-color:var(--papel);
  background-image:linear-gradient(var(--rejilla) 1px,transparent 1px),linear-gradient(90deg,var(--rejilla) 1px,transparent 1px);
  background-size:28px 28px;
}
h1,h2,h3{font-family:var(--display); line-height:1.15; margin:0 0 .5em; font-weight:600}
h1{font-size:2.3rem} h2{font-size:1.7rem} h3{font-size:1.25rem}
p{margin:0 0 .8em; max-width:68ch}
a{color:var(--azul)}
img,svg{max-width:100%}
button{font:inherit; cursor:pointer}
:focus-visible{outline:3px solid var(--amarillo); outline-offset:3px; border-radius:6px}

/* Barra superior */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--sup); border-bottom:3px solid var(--tinta);
  display:flex; align-items:center; gap:14px; padding:10px 18px}
.logo{display:flex; align-items:center; gap:10px; font-family:var(--display); font-weight:700; font-size:1.25rem; background:none; border:0; color:var(--tinta); padding:0}
.logo svg{width:38px; height:44px}
.top .sp{flex:1}
.chip{display:flex; align-items:center; gap:6px; font-family:var(--display); font-weight:600; background:var(--sup2); border:2px solid var(--borde); border-radius:999px; padding:4px 12px; font-size:1rem}
.chip b{font-size:1.1rem}
.icon-btn{background:var(--sup2); border:2px solid var(--borde); border-radius:12px; width:42px; height:42px; font-size:1.2rem; color:var(--tinta)}

main{max-width:1120px; margin:0 auto; padding:24px 18px 60px}

/* Botones de juguete */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; font-family:var(--display); font-weight:600; font-size:1.05rem;
  border:3px solid var(--tinta); border-radius:14px; padding:10px 18px; background:var(--azul); color:#fff;
  box-shadow:0 4px 0 var(--tinta); transition:transform .08s, box-shadow .08s}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--tinta)}
.btn:disabled{opacity:.5; cursor:not-allowed}
.btn.verde{background:var(--verde)} .btn.amarillo{background:var(--amarillo); color:#16263D} .btn.blanco{background:var(--sup); color:var(--tinta)}
.btn.rojo{background:var(--rojo)}
.btn.sm{font-size:.95rem; padding:6px 12px; border-width:2px; box-shadow:0 3px 0 var(--tinta)}
.fila{display:flex; flex-wrap:wrap; gap:12px; align-items:center}

.panel{background:var(--sup); border:3px solid var(--tinta); border-radius:20px; padding:22px}
.nota{background:var(--sup2); border-left:6px solid var(--azul); border-radius:10px; padding:12px 16px; margin:12px 0}
.nota.ok{border-color:var(--verde)} .nota.mal{border-color:var(--rojo)} .nota.idea{border-color:var(--amarillo)}
.muted{color:var(--tinta2)}

/* Mapa de misiones */
.hero{display:grid; grid-template-columns:minmax(0,1fr) 220px; gap:24px; align-items:center; margin-bottom:28px}
.hero h1{font-size:2.6rem}
.hero .bit{width:200px}
.mapa{position:relative; padding-left:0; list-style:none; margin:0}
.mapa li{position:relative; display:grid; grid-template-columns:64px minmax(0,1fr); gap:16px; padding-bottom:18px}
.mapa li::before{content:""; position:absolute; left:30px; top:60px; bottom:-4px; width:4px; background:var(--tinta); opacity:.25}
.mapa li:last-child::before{display:none}
.nodo{width:64px; height:64px; border-radius:50%; border:3px solid var(--tinta); display:grid; place-items:center; font-family:var(--display); font-weight:700; font-size:1.5rem; background:var(--sup)}
.mapa li.hecha .nodo{background:var(--verde); color:#fff}
.mapa li.abierta .nodo{background:var(--amarillo); color:#16263D}
.mapa li.cerrada .nodo{background:var(--sup2); color:var(--tinta2); border-style:dashed}
.mcard{text-align:left; width:100%; background:var(--sup); border:3px solid var(--tinta); border-radius:18px; padding:14px 18px; color:var(--tinta);
  display:flex; align-items:center; gap:14px; box-shadow:0 4px 0 var(--tinta)}
.mcard:disabled{box-shadow:none; border-style:dashed; border-color:var(--borde); cursor:default}
.mcard h3{margin:0}
.mcard .estado{margin-left:auto; font-family:var(--display); font-weight:600; font-size:.95rem; white-space:nowrap}
.mcard .emo{font-size:1.8rem}

/* Misión */
.mhead{display:flex; align-items:center; gap:14px; margin-bottom:16px; flex-wrap:wrap}
.mhead h1{margin:0; font-size:2rem}
.pasos{display:flex; gap:8px; flex-wrap:wrap; margin:0 0 22px; padding:0; list-style:none; counter-reset:f}
.pasos button{font-family:var(--display); font-weight:600; font-size:.95rem; border:2px solid var(--tinta); border-radius:999px; background:var(--sup); color:var(--tinta); padding:6px 14px 6px 8px; display:flex; align-items:center; gap:8px}
.pasos button .n{color:var(--tinta); display:grid; place-items:center; width:26px; height:26px; border-radius:50%; background:var(--sup2); border:2px solid var(--tinta); font-size:.85rem}
.pasos button.act{background:var(--tinta); color:var(--papel)}
.pasos button.hecho .n{background:var(--verde); color:#fff; border-color:var(--tinta)}
.grid2{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:22px; align-items:start}
.grid3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px}
.nav-fase{display:flex; justify-content:space-between; margin-top:22px; gap:12px; flex-wrap:wrap}

/* Escena de BIT */
.scene{position:relative; border:3px solid var(--tinta); border-radius:20px; overflow:hidden; min-height:340px; display:flex; align-items:flex-end; justify-content:center;
  background:linear-gradient(#F9E7C9 0 72%, #C79A6B 72% 100%)}
.scene.fuera{background:linear-gradient(#9ED4FF 0 64%, #8C949E 64% 70%, #5B636D 70% 100%)}
.scene .deco{position:absolute; left:14px; top:12px; font-size:2rem}
.scene .bit{width:190px; margin-bottom:6px; position:relative; z-index:2}
.bubble{position:absolute; top:14px; right:14px; left:70px; background:#fff; color:#16263D; border:3px solid #16263D; border-radius:16px; padding:10px 14px; font-family:var(--display); font-weight:500; font-size:1.05rem; z-index:3; min-height:48px}
.bubble:empty{display:none}
.scene.shake .bit{animation:shake .5s}
@keyframes shake{20%{transform:translateX(-10px) rotate(-4deg)}40%{transform:translateX(10px) rotate(4deg)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.scene.feliz .bit{animation:salto .6s 2}
@keyframes salto{50%{transform:translateY(-22px)}}
.bit .antena{animation:parpadeo 1.6s infinite}
@keyframes parpadeo{50%{opacity:.35}}

/* capas de BIT */
.bit .l-wet,.bit .l-socks,.bit .l-shoes,.bit .l-over,.bit .l-pack,.bit .l-shirt,.bit .l-dirty,.bit .l-shine,.bit .l-sleep{display:none}
.bit.sleep .l-sleep{display:inline} .bit.sleep .l-eyes{display:none}
.bit.wet .l-wet{display:inline} .bit.socks .l-socks{display:inline} .bit.shoes .l-shoes{display:inline}
.bit.over .l-over{display:inline} .bit.pack .l-pack{display:inline} .bit.shirt .l-shirt{display:inline}
.bit.dirty .l-dirty{display:inline} .bit.shine .l-shine{display:inline}

/* Tarjetas de pasos ordenables */
.lista{list-style:none; margin:0; padding:0; display:grid; gap:8px}
.lista li{display:flex; align-items:center; gap:10px; background:var(--sup); border:2px solid var(--tinta); border-radius:12px; padding:8px 10px; font-weight:700}
.lista li .num{font-family:var(--display); min-width:28px; height:28px; border-radius:8px; display:grid; place-items:center; background:var(--sup2); border:2px solid var(--borde)}
.lista li .emo{font-size:1.4rem}
.lista li .txt{flex:1}
.lista li.run{background:var(--amarillo); color:#16263D}
.lista li.ok{background:#CFF3E3; color:#16263D}
.lista li.mal{background:#FFD3D4; color:#16263D; border-color:var(--rojo)}
.handle{cursor:grab; font-size:1.3rem; color:var(--tinta2); user-select:none; padding:0 4px}
.mini{background:var(--sup2); border:2px solid var(--borde); border-radius:8px; width:32px; height:32px; color:var(--tinta); font-size:.9rem; padding:0}
.ghost{opacity:.4}
.lista input{flex:1; font:inherit; font-weight:400; border:2px solid var(--borde); border-radius:8px; padding:6px 10px; background:var(--papel); color:var(--tinta); min-width:0}

/* Conceptos */
.concepto{background:var(--sup); border:3px solid var(--tinta); border-radius:18px; padding:16px}
.concepto .emo{font-size:2rem}
.regla{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px; margin-top:8px}
.regla div{border-radius:10px; padding:8px 10px; font-size:.95rem}
.regla .no{background:#FFE1E2; color:#16263D} .regla .si{background:#D5F5E6; color:#16263D}

/* Quiz */
.q{margin-bottom:18px}
.q .ops{display:grid; gap:8px; margin-top:8px}
.op{text-align:left; background:var(--sup); color:var(--tinta); border:2px solid var(--tinta); border-radius:12px; padding:10px 14px; font-weight:700}
.op.bien{background:#CFF3E3; color:#16263D; border-color:var(--verde)}
.op.malo{background:#FFD3D4; color:#16263D; border-color:var(--rojo)}
.op:disabled{cursor:default}

/* Diagramas de flujo */
.flow{list-style:none; margin:0; padding:10px 0; display:flex; flex-direction:column; align-items:center; gap:0; min-height:120px}
.flow li{display:flex; flex-direction:column; align-items:center}
.flow li + li::before{content:""; display:block; width:4px; height:18px; background:var(--tinta)}
.flow li + li .blk{position:relative}
.flow li + li .blk::before{content:""; position:absolute; top:-10px; left:50%; transform:translateX(-50%); border:8px solid transparent; border-top:10px solid var(--tinta)}
.blk{display:flex; align-items:center; gap:8px; border:3px solid var(--tinta); color:#fff; font-weight:700; min-width:260px; max-width:380px; width:100%; padding:10px 14px; justify-content:center; text-align:center}
.blk.inicio,.blk.fin{background:var(--verde); border-radius:999px; font-family:var(--display); letter-spacing:.02em}
.blk.proceso{background:var(--azul); border-radius:4px}
.blk input{flex:1; font:inherit; font-weight:700; color:#16263D; background:#fff; border:0; border-radius:6px; padding:4px 8px; min-width:0}
.blk .x{background:rgba(255,255,255,.25); color:#fff; border:0; border-radius:6px; width:28px; height:28px; padding:0}
.blk .handle{color:rgba(255,255,255,.85)}
.blk.run{outline:5px solid var(--amarillo); outline-offset:3px}
.blk.err{outline:5px solid var(--rojo); outline-offset:3px}
.blk.bugok{outline:5px solid var(--verde); outline-offset:3px}
.blk.estatico{min-width:200px}
button.blk{font:inherit; font-weight:700}
.simbolo{display:grid; grid-template-columns:120px minmax(0,1fr); gap:14px; align-items:center; background:var(--sup); border:3px solid var(--tinta); border-radius:16px; padding:12px 14px}
.simbolo.cerrado{border-style:dashed; border-color:var(--borde); color:var(--tinta2)}
.forma{display:grid; place-items:center; height:52px; border:3px solid var(--tinta); color:#fff; font-weight:700; font-size:.85rem; font-family:var(--display)}
.forma.ov{border-radius:999px; background:var(--verde)} .forma.re{background:var(--azul)}
.forma.ro{background:var(--amarillo); color:#16263D; transform:rotate(45deg) scale(.6); width:52px; margin:auto}
.forma.pa{background:#9B6BFF; transform:skewX(-18deg)}
.forma.fl{border:0; color:var(--tinta); font-size:2rem}
.bitmini{width:90px}
.pegado{position:sticky; top:90px}
@media (max-width:820px){.pegado{position:static}}

/* Bloques ampliados */
.blk.decision{background:var(--amarillo); color:#16263D; border-radius:4px}
.blk.es{background:#8A5CF0; transform:skewX(-12deg); border-radius:2px}
.blk.es>*{transform:skewX(12deg)}
.blk.bucle{background:var(--naranja); color:#16263D; border-radius:14px 14px 4px 4px; flex-wrap:wrap}
.blk.bucle input[type=number]{flex:0 0 70px}
.blk.decision .handle,.blk.bucle .handle{color:rgba(22,38,61,.7)}
.blk.decision .x,.blk.bucle .x{background:rgba(22,38,61,.15); color:#16263D}
.tagest{font-family:var(--display); font-size:.75rem; background:rgba(255,255,255,.2); border-radius:6px; padding:1px 6px; margin-right:4px}
.blk .tag{font-size:.8rem; font-family:var(--display); font-weight:700; white-space:nowrap; background:rgba(255,255,255,.2); border-radius:6px; padding:2px 6px}
.siempre{display:inline-flex; align-items:center; gap:4px; margin:0; font-size:.9rem}
.ramas{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px; width:100%; max-width:380px; background:var(--sup2); border:3px dashed var(--amarillo-o); border-top:0; border-radius:0 0 12px 12px; padding:8px}
.ramas.una{grid-template-columns:minmax(0,1fr); border-color:var(--naranja)}
.subt{font-family:var(--display); font-weight:700; font-size:.95rem}
.subp{display:flex; gap:4px; margin:4px 0}
.subp input,.stp{flex:1; min-width:0; font:inherit; font-size:.9rem; font-weight:700; border:2px solid var(--tinta); border-radius:4px; padding:4px 8px; background:var(--azul); color:#fff}
.subp input{background:var(--sup); color:var(--tinta); border-color:var(--azul)}
.stp{display:block; margin:4px 0}
.stp select{font:inherit; font-size:.85rem; width:100%; border-radius:4px; border:0; padding:3px}
.subp input.run,.stp.run{outline:4px solid var(--amarillo); outline-offset:2px}
.subp .x{background:var(--sup); color:var(--tinta); border:1px solid var(--borde); border-radius:6px; width:28px; padding:0}
.mini2{font:inherit; font-size:.85rem; background:none; border:2px dashed var(--borde); border-radius:6px; color:var(--tinta2); padding:2px 8px; margin-top:2px}
.btn.pal-decision,.btn.naranja{background:var(--amarillo); color:#16263D}
.btn.pal-entrada,.btn.pal-salida{background:#8A5CF0}
.btn.pal-bucle,.btn.naranja{background:var(--naranja); color:#16263D}
.btn.pal-inicio,.btn.pal-fin{background:var(--verde)}
.btn.act{background:var(--amarillo); color:#16263D}
.ask{margin-top:12px; background:var(--sup); border:3px solid var(--tinta); border-radius:16px; padding:14px}
.bit .l-umb,.bit .l-gafas{display:none} .bit.umb .l-umb{display:inline} .bit.gafas .l-gafas{display:inline}
.scene.lluvia{background:linear-gradient(#8A9AAE 0 64%, #6B737D 64% 70%, #4B535D 70% 100%)}
.scene.lluvia::after{content:""; position:absolute; inset:0; z-index:1; pointer-events:none; background:repeating-linear-gradient(100deg,transparent 0 18px,rgba(58,160,255,.6) 18px 20px); background-size:100% 60px; animation:lluvia .4s linear infinite}
@keyframes lluvia{to{background-position:0 60px}}
.led{width:52px; height:52px; border-radius:50%; border:3px solid var(--tinta); background:#5A1F1F}
.led.on{background:#FF3B3B; box-shadow:0 0 28px #FF3B3B}
.escalera{border:3px solid var(--tinta); border-radius:20px; overflow-x:auto; background:linear-gradient(#CFE8FF,#EAF4FF)}
.escalera svg{display:block; min-width:420px; width:100%}
#rob{transition:transform .16s linear}
#rob.cae{transition:transform .8s ease-in}
.dev{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.pant{background:var(--pantalla); color:var(--ojo); font-family:var(--display); border-radius:14px; padding:14px 16px; min-height:56px; font-size:1.1rem}
@media (max-width:820px){.ramas{max-width:100%}}

/* Constructor guiado */
.bit{transition:transform .25s ease}
.bit.agachado{transform:translateY(30px) scaleY(.86); transform-origin:50% 100%}
.bit .brazo-d{transform-box:view-box; transform-origin:155px 120px; transition:transform .2s}
.bit.saluda .brazo-d{transform:rotate(-150deg)}
.bit.aplaude .brazo-d{transform:rotate(-40deg)}
.contador{position:absolute; right:14px; bottom:12px; z-index:3; background:#16263D; color:#fff; font-family:var(--display); font-weight:700; border-radius:12px; padding:6px 12px; font-size:1.1rem}
.lienzo{border:3px solid var(--tinta); border-radius:20px; overflow:hidden; background:#fff; background-image:linear-gradient(#E6EEF6 1px,transparent 1px),linear-gradient(90deg,#E6EEF6 1px,transparent 1px); background-size:20px 20px}
.lienzo svg{display:block; width:100%; height:auto}
#tort{transition:transform .35s linear}
.blk select{flex:1; font:inherit; font-weight:700; border:0; border-radius:6px; padding:4px 6px; min-width:0; color:#16263D; background:#fff}

/* Misión 6 */
.letras{display:grid; gap:8px}
.letra{display:grid; grid-template-columns:40px auto minmax(0,1fr); gap:12px; align-items:center; background:var(--sup); border:2px solid var(--borde); border-radius:12px; padding:8px 12px}
.letra b{font-family:var(--display); font-size:1.4rem; text-align:center}
.bombillas{display:flex; gap:4px}
.bomb{width:16px; height:16px; border-radius:50%; border:2px solid var(--tinta); background:#3A4250}
.bomb.on{background:#FFC23D; box-shadow:0 0 8px #FFC23D}
.bin{font-family:ui-monospace,Consolas,monospace; letter-spacing:.08em}
.codigo{font-family:ui-monospace,Consolas,"Courier New",monospace; background:#0E1A2B; color:#E7EFF8; border-radius:12px; padding:12px 14px; font-size:.92rem; white-space:pre; overflow-x:auto; margin:6px 0; line-height:1.5}
.codigo .k{color:#FF9E64} .codigo .s{color:#9ECE6A} .codigo .f{color:#7AA2F7}
.nivel{display:grid; grid-template-columns:120px minmax(0,1fr); gap:14px; align-items:center; border:3px solid var(--tinta); border-radius:14px; padding:10px 14px; background:var(--sup); margin-bottom:10px}
.nivel .et{font-family:var(--display); font-weight:700; text-align:center}
.apps{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin:10px 0}
.app{border:3px solid var(--tinta); border-radius:18px; background:var(--sup2); padding:10px 6px; text-align:center; font-weight:700; font-size:.9rem; color:var(--tinta)}
.app span{display:block; font-size:1.8rem}
.escenario{position:relative; border:3px solid var(--tinta); border-radius:20px; min-height:280px; overflow:hidden; background:linear-gradient(#DFF1FF 0 75%, #B9C6D6 75% 100%)}
.actor{position:absolute; bottom:8px; left:50%; width:130px; margin-left:-65px; transition:transform .45s ease}
.actor .bit{width:130px}
.actor.giro .bit{transform:scaleX(-1)}
.escenario .bubble{left:14px}
.tl{display:grid; grid-template-columns:minmax(0,1fr) 130px; gap:10px; align-items:center; font-family:ui-monospace,Consolas,monospace; border-radius:8px; padding:4px 8px}
.tl input{font:inherit; border:2px solid var(--borde); border-radius:8px; padding:6px 8px; background:var(--sup); color:var(--tinta); min-width:0}
.tl.run{background:var(--amarillo); color:#16263D}
.tl.mal{background:#FFD3D4; color:#16263D}
.tl.mal input{border-color:var(--rojo)}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chipc{font-family:ui-monospace,Consolas,monospace; background:var(--sup2); border:2px solid var(--borde); border-radius:999px; padding:2px 10px; font-size:.9rem}
.lang{background:var(--sup); border:3px solid var(--tinta); border-radius:18px; padding:14px}
.lang h3{margin-bottom:6px}
.lang .fila{margin-top:8px}
.lang.ok{border-color:var(--verde)}
.pz{list-style:none; --c:#2F6FEB; background:var(--c); color:#fff; font-family:var(--display); font-weight:600; font-size:.95rem; line-height:1.3; border-radius:8px; padding:6px 10px; margin:6px 0 4px; border:2px solid rgba(0,0,0,.3); display:flex; align-items:center; gap:8px; cursor:grab; position:relative; flex-wrap:wrap}
.pz::before{content:""; position:absolute; left:18px; top:-7px; width:20px; height:7px; background:var(--c); border:2px solid rgba(0,0,0,.3); border-bottom:0; border-radius:4px 4px 0 0}
.pz.lapiz{--c:#149E6C} .pz.avanza,.pz.gira{--c:#2F6FEB}
.pz.rep{--c:#FF8A3D; color:#16263D; flex-direction:column; align-items:stretch}
.pz.rep>.cab{display:flex; align-items:center; gap:8px}
.pz.hat{--c:#E6A800; color:#16263D; border-radius:18px 18px 8px 8px; cursor:default}
.pz.hat::before{display:none}
.pz input,.pz select{font:inherit; font-size:.9rem; width:58px; border:0; border-radius:6px; padding:2px 4px; color:#16263D; background:#fff}
.pz .x{margin-left:auto; background:rgba(0,0,0,.2); color:inherit; border:0; border-radius:6px; width:26px; height:26px; padding:0}
.pzlist{list-style:none; margin:0; padding:0; min-height:40px}
.pz.rep .pzlist{margin:4px 0 4px 10px; padding:4px 6px; background:rgba(255,255,255,.4); border-radius:6px; min-height:44px}
.ws{background:var(--sup2); border:3px dashed var(--borde); border-radius:16px; padding:10px; min-height:220px}
.pz .x{flex:0 0 26px}
.paleta .pz{cursor:copy}
.pz.run{outline:4px solid var(--amarillo); outline-offset:2px}
.tabs-code{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:12px}
@media (max-width:820px){.nivel{grid-template-columns:minmax(0,1fr)} .apps{grid-template-columns:repeat(2,minmax(0,1fr))} .tabs-code{grid-template-columns:minmax(0,1fr)} .tl{grid-template-columns:minmax(0,1fr) 100px}}

/* Misión 7 */
.marcador{position:sticky; top:calc(72px + env(safe-area-inset-top,0px)); z-index:10; display:flex; flex-wrap:wrap; gap:10px; align-items:center; background:var(--tinta); color:var(--papel); border-radius:16px; padding:10px 16px; margin-bottom:18px; font-family:var(--display); font-weight:600}
.marcador b{font-size:1.3rem}
.marcador .sp{flex:1}
.item{background:var(--sup); border:3px solid var(--tinta); border-radius:18px; padding:18px; margin-bottom:16px}
.item.hecho{border-color:var(--verde)}
.item .pts{float:right; font-family:var(--display); font-weight:700; background:var(--sup2); border:2px solid var(--borde); border-radius:999px; padding:2px 10px; font-size:.9rem}
.retocab{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:12px}
.evalua{background:var(--sup2); border-radius:10px; padding:6px 12px; font-size:.95rem}
.codigoRes{font-family:ui-monospace,Consolas,monospace; font-size:2.4rem; font-weight:700; letter-spacing:.12em; background:var(--tinta); color:var(--amarillo); border-radius:16px; padding:10px 20px; display:inline-block}
.barra{height:14px; background:var(--sup2); border:2px solid var(--borde); border-radius:999px; overflow:hidden}
.barra i{display:block; height:100%; background:var(--verde)}
.tabla{width:100%; border-collapse:collapse; font-size:.95rem}
.tabla th,.tabla td{padding:8px 10px; border-bottom:2px solid var(--borde); text-align:left; white-space:nowrap}
.tabla th{font-family:var(--display)}
.tabla tr.nuevo{animation:flash 1.6s}
@keyframes flash{0%,40%{background:var(--amarillo); color:#16263D}}
.scroll{overflow-x:auto}
.podio{display:flex; align-items:flex-end; justify-content:center; gap:14px; margin:10px 0 20px}
.esc{width:30%; max-width:220px; text-align:center}
.esc .nom{font-family:var(--display); font-weight:700; font-size:1.2rem; margin-bottom:6px; overflow:hidden; text-overflow:ellipsis}
.esc .col{border:3px solid var(--tinta); border-bottom:0; border-radius:14px 14px 0 0; display:grid; place-items:center; font-size:2.4rem; animation:sube .6s ease-out}
.esc.p1 .col{height:170px; background:#FFD166} .esc.p2 .col{height:125px; background:#D9E2EC} .esc.p3 .col{height:95px; background:#E8B78A}

body.proyector .solo-profe{display:none!important}
body.proyector .tabla{font-size:1.25rem}
.fila-min{display:flex; gap:10px; flex-wrap:wrap; align-items:end}
.mcard.act{outline:4px solid var(--amarillo); outline-offset:2px}
.fila-min>div{flex:1; min-width:150px}

/* Insignia */
.tarjeta{max-width:560px; margin:0 auto; background:var(--sup); border:4px solid var(--tinta); border-radius:24px; padding:26px; text-align:center}

/* Formularios */

.toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--tinta); color:var(--papel); font-family:var(--display); font-weight:600; padding:10px 20px; border-radius:999px; z-index:50; font-size:1.1rem}

}

<body>

  <div class="sp"></div>

</header>
<main id="app"></main>
<footer>Unidad 1 · Introducción a la programación · 3.º ESO Computación y Robótica<br>Autor: Manuel Martín Soriano</footer>

<dialog id="dlgC"><p id="dlgCt" style="font-weight:700;font-size:1.1rem"></p><div class="fila" style="justify-content:flex-end"><button class="btn blanco sm" id="dlgCno">Cancelar</button><button class="btn verde sm" id="dlgCsi">Sí, adelante</button></div></dialog>
<dialog id="dlg">
  <h2>Ajustes</h2>
  <p id="dlgInfo" class="muted"></p>
  <div class="fila" style="margin-bottom:14px">
    <button class="btn blanco sm" id="tema">🌗 Cambiar tema</button>
    <button class="btn sm" id="camb">👤 Cambiar de alumno</button>
    <button class="btn rojo sm" id="reset">Borrar mi progreso</button>
  </div>
  <form method="dialog"><button class="btn sm">Cerrar</button></form>
</dialog>

<script>
/* ================= CONFIRMACIÓN PROPIA (los diálogos del navegador están bloqueados) ================= */
function confirmar(msg,si='Sí, adelante'){return new Promise(res=>{const d=document.getElementById('dlgC');document.getElementById('dlgCt').textContent=msg;document.getElementById('dlgCsi').textContent=si;
  const fin=v=>{d.close();res(v)};document.getElementById('dlgCsi').onclick=()=>fin(true);document.getElementById('dlgCno').onclick=()=>fin(false);d.oncancel=e=>{e.preventDefault();fin(false)};
  try{d.showModal()}catch(e){res(true)}})}
/* ================= ESTADO (perfiles por alumno) ================= */
const KEY='academiaBit.u1.v1';          // formato antiguo: un solo alumno por ordenador
const PREF='academiaBit3.u1', NIVEL='3ESO';
const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const base=()=>({name:'',grupo:'',color:'#2F6FEB',xp:0,awarded:{},badges:{},m:{0:{done:{}},1:{done:{},pistas:0},2:{done:{},pistas:0},3:{done:{},pistas:0},4:{done:{},pistas:0},5:{done:{},pistas:0},6:{done:{},pistas:0},7:{done:{},pistas:0}}});
function normS(x){x=Object.assign(base(),x&&typeof x==='object'?x:{});for(const k of [0,1,2,3,4,5,6,7])x.m[k]=Object.assign({done:{},pistas:0},x.m[k]||{});return x}
const hpin=p=>{let h=2166136261;for(const c of p+'|'+PREF){h^=c.charCodeAt(0);h=Math.imul(h,16777619)>>>0}return h.toString(36)};
let PER=null;try{PER=JSON.parse(LS.get(PREF+'.perfiles'))}catch(e){}
if(!PER||!Array.isArray(PER.lista))PER={lista:[]};
const savePER=()=>LS.set(PREF+'.perfiles',JSON.stringify(PER));

let ACT=null;try{ACT=sessionStorage.getItem(PREF+'.activo')}catch(e){}
if(ACT&&!PER.lista.some(p=>p.id===ACT))ACT=null;
let S=base();
function cargar(id){try{S=normS(JSON.parse(LS.get(PREF+'.p.'+id)))}catch(e){S=base()}}
if(ACT)cargar(ACT);
function save(){if(ACT)LS.set(PREF+'.p.'+ACT,JSON.stringify(S))}
function entrar(id){ACT=id;try{sessionStorage.setItem(PREF+'.activo',id)}catch(e){}cargar(id)}
function salir(){ACT=null;try{sessionStorage.removeItem(PREF+'.activo')}catch(e){}S=base()}
try{const t=localStorage.getItem('academiaBit3.tema'); if(t)document.documentElement.dataset.theme=t}catch(e){}

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
function addXP(key,n){ if(S.awarded[key]!==undefined) return; S.awarded[key]=n; S.xp+=n; save(); barra(); toast(`+${n} XP ⚡`) }
function gastar(n){ S.xp=Math.max(0,S.xp-n); save(); barra() }
function done(m,f){ if(S.m[m].done[f])return; S.m[m].done[f]=true; save(); const i=(FASES[m]||[]).findIndex(x=>x.id===f); const b=$$('.pasos button')[i]; if(b){b.classList.add('hecho');b.querySelector('.n').textContent='✓'} }
function mXP(m){ return Object.entries(S.awarded).filter(([k])=>k.startsWith('m'+m+'-')).reduce((a,[,v])=>a+v,0) }
function barra(){ $('#xp').textContent=S.xp; $('#ins').textContent=Object.keys(S.badges).length; $('#logoBit').innerHTML=bitSVG('logo'); document.documentElement.style.setProperty('--bitc',S.color) }

/* ================= BIT ================= */
function bitSVG(id,cls=''){return `<svg class="bit ${cls}" id="${id}" viewBox="0 0 200 250" role="img" aria-label="BIT, el robot">
 <g class="l-pack"><rect x="118" y="102" width="62" height="70" rx="12" fill="#149E6C" stroke="#16263D" stroke-width="4"/><rect x="164" y="126" width="16" height="22" rx="4" fill="#0C7650" stroke="#16263D" stroke-width="3"/></g>
 <line x1="100" y1="14" x2="100" y2="32" stroke="#16263D" stroke-width="5"/><circle class="antena" cx="100" cy="11" r="8" fill="#FFC23D" stroke="#16263D" stroke-width="3"/>
 <rect x="46" y="30" width="108" height="76" rx="22" fill="var(--bitc)" stroke="#16263D" stroke-width="5"/>
 <rect x="61" y="44" width="78" height="48" rx="13" fill="var(--pantalla)"/>
 <g class="l-eyes"><circle cx="84" cy="64" r="8" fill="var(--ojo)"/><circle cx="116" cy="64" r="8" fill="var(--ojo)"/></g>
 <g class="l-sleep" stroke="var(--ojo)" stroke-width="4" stroke-linecap="round"><line x1="76" y1="65" x2="92" y2="65"/><line x1="108" y1="65" x2="124" y2="65"/></g>
 <path d="M88 79 Q100 88 112 79" fill="none" stroke="var(--ojo)" stroke-width="4" stroke-linecap="round"/>
 <g class="l-dirty" fill="#B5793F"><circle cx="92" cy="84" r="3"/><circle cx="104" cy="86" r="2.5"/><circle cx="111" cy="82" r="2"/><circle cx="97" cy="80" r="2"/></g>
 <g class="l-shine" fill="#fff"><path d="M126 76 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z"/></g>
 <rect x="36" y="114" width="18" height="52" rx="9" fill="var(--bitc)" stroke="#16263D" stroke-width="4"/>
 <rect class="brazo-d" x="146" y="114" width="18" height="52" rx="9" fill="var(--bitc)" stroke="#16263D" stroke-width="4"/>
 <rect x="72" y="176" width="20" height="50" rx="6" fill="#9FB0C4" stroke="#16263D" stroke-width="4"/>
 <rect x="108" y="176" width="20" height="50" rx="6" fill="#9FB0C4" stroke="#16263D" stroke-width="4"/>
 <rect x="56" y="108" width="88" height="72" rx="18" fill="var(--bitc)" stroke="#16263D" stroke-width="5"/>
 <g class="l-shirt"><path d="M56 126 Q56 108 74 108 L126 108 Q144 108 144 126 L144 164 L56 164Z" fill="#FF8A3D" stroke="#16263D" stroke-width="5"/><path d="M88 108 L100 122 L112 108" fill="#fff" stroke="#16263D" stroke-width="3"/></g>
 <circle cx="100" cy="148" r="6" fill="#FFC23D" stroke="#16263D" stroke-width="3"/>
 <g class="l-pack"><rect x="64" y="110" width="9" height="56" rx="3" fill="#0C7650" stroke="#16263D" stroke-width="2"/><rect x="127" y="110" width="9" height="56" rx="3" fill="#0C7650" stroke="#16263D" stroke-width="2"/></g>
 <g class="l-socks"><rect x="70" y="204" width="24" height="20" rx="4" fill="#fff" stroke="#16263D" stroke-width="3"/><rect x="106" y="204" width="24" height="20" rx="4" fill="#fff" stroke="#16263D" stroke-width="3"/><line x1="70" y1="210" x2="94" y2="210" stroke="#E0474C" stroke-width="3"/><line x1="106" y1="210" x2="130" y2="210" stroke="#E0474C" stroke-width="3"/></g>
 <g class="l-shoes"><ellipse cx="80" cy="232" rx="20" ry="11" fill="#C2362F" stroke="#16263D" stroke-width="4"/><ellipse cx="120" cy="232" rx="20" ry="11" fill="#C2362F" stroke="#16263D" stroke-width="4"/></g>
 <g class="l-over"><rect x="66" y="214" width="26" height="24" rx="6" fill="#fff" stroke="#16263D" stroke-width="3"/><rect x="108" y="214" width="26" height="24" rx="6" fill="#fff" stroke="#16263D" stroke-width="3"/><line x1="66" y1="222" x2="92" y2="222" stroke="#E0474C" stroke-width="3"/><line x1="108" y1="222" x2="134" y2="222" stroke="#E0474C" stroke-width="3"/></g>
 <g class="l-wet" fill="#3AA0FF" stroke="#16263D" stroke-width="2"><path d="M30 60 q6 10 0 14 q-6 -4 0 -14z"/><path d="M170 80 q6 10 0 14 q-6 -4 0 -14z"/><path d="M24 140 q6 10 0 14 q-6 -4 0 -14z"/><path d="M176 150 q6 10 0 14 q-6 -4 0 -14z"/><path d="M100 196 q5 8 0 12 q-5 -4 0 -12z"/></g>
 <g class="l-gafas"><rect x="70" y="55" width="28" height="18" rx="5" fill="#111" stroke="#16263D" stroke-width="2"/><rect x="102" y="55" width="28" height="18" rx="5" fill="#111" stroke="#16263D" stroke-width="2"/><line x1="98" y1="62" x2="102" y2="62" stroke="#111" stroke-width="3"/></g>
 <g class="l-umb"><line x1="172" y1="60" x2="160" y2="168" stroke="#16263D" stroke-width="4"/><path d="M122 62 Q170 8 200 70 Z" fill="#E0474C" stroke="#16263D" stroke-width="4"/></g>
 <g class="l-sleep"><text x="150" y="30" font-family="Fredoka,sans-serif" font-weight="700" font-size="22" fill="#16263D">Z z</text></g>
</svg>`}

function medalla(emo,color){return `<svg class="medalla" viewBox="0 0 140 150" aria-hidden="true"><path d="M50 96 L36 146 L56 134 L66 150 L76 104Z" fill="#E0474C" stroke="#16263D" stroke-width="4"/><path d="M90 96 L104 146 L84 134 L74 150 L64 104Z" fill="#2F6FEB" stroke="#16263D" stroke-width="4"/><polygon points="70,6 122,34 122,90 70,118 18,90 18,34" fill="${color}" stroke="#16263D" stroke-width="5"/><polygon points="70,20 110,42 110,82 70,104 30,82 30,42" fill="none" stroke="#16263D" stroke-width="2" opacity=".35"/><text x="70" y="76" text-anchor="middle" font-size="42">${emo}</text></svg>`}

/* ================= MISIONES ================= */
const MIS=[
 {n:0,t:'Bienvenida a la Academia',emo:'👋',abierta:true},
 {n:1,t:'¿Qué es un algoritmo?',emo:'🧩',abierta:true},
 {n:2,t:'Diagramas de flujo',emo:'🗺️',abierta:true},
 {n:3,t:'Decisiones: ¿sí o no?',emo:'🔀',abierta:true},
 {n:4,t:'Entrada y salida de datos',emo:'⌨️',abierta:true},
 {n:5,t:'Bucles: repetir sin cansarse',emo:'🔁',abierta:true},
 {n:6,t:'Programas y lenguajes',emo:'💬',abierta:true},
 {n:7,t:'La gran competición (SdA)',emo:'🏆',abierta:true},
];
const BADGE={0:{t:'Recluta de la Academia',emo:'🎖️',c:'#FFC23D'},1:{t:'Maestro del orden',emo:'🧩',c:'#7EF0C1'},2:{t:'Dibujante de diagramas',emo:'🗺️',c:'#9ECBFF'},3:{t:'Experto en decisiones',emo:'🔀',c:'#FFE08A'},4:{t:'Maestro de los datos',emo:'⌨️',c:'#D9C7FF'},5:{t:'Domador de bucles',emo:'🔁',c:'#FFC59E'},6:{t:'Traductor de lenguajes',emo:'🌐',c:'#A8E6CF'},7:{t:'Campeón de la Academia',emo:'🏆',c:'#FFD166'}};

let V={view:'home',fase:0};
function ir(view,fase=0){V={view,fase};render();window.scrollTo(0,0)}

function render(){
  barra();
  const app=$('#app');
  if(!ACT && V.view!=='m0' && V.view!=='login'){V.view='login'}
  if(V.view==='home') return home(app);
  if(V.view==='m0') return m0(app);
  if(V.view==='login') return login(app);
  if(/^m[1-7]$/.test(V.view)) return mision(app,+V.view[1]);
}

function estadoMision(m){
  if(!m.abierta) return 'cerrada';
  if(S.badges[m.n]) return 'hecha';
  return 'abierta';
}
function home(app){
  const nombre=esc(S.name);
  app.innerHTML=`<section class="hero"><div><h1>Hola, ${nombre}. BIT te espera.</h1>
  <p>BIT es un robot recién montado que todavía no sabe hacer nada. Tu trabajo es enseñarle, misión a misión, a seguir instrucciones como un ordenador de verdad.</p></div>${bitSVG('bitHero')}</section>
  <ol class="mapa">${MIS.map(m=>{const e=estadoMision(m);return `<li class="${e}"><div class="nodo">${e==='hecha'?'✓':m.n}</div>
   <button class="mcard" data-m="${m.n}" ${e==='cerrada'?'disabled':''}><span class="emo">${m.emo}</span><span><h3>${m.t}</h3>${m.n>0&&m.abierta?`<span class="muted">${mXP(m.n)} XP conseguidos</span>`:''}</span>
   <span class="estado">${e==='hecha'?'✅ Completada':e==='abierta'?'▶ Jugar':'🔒 Próximamente'}</span></button></li>`}).join('')}</ol>`;
  $$('.mcard').forEach(b=>b.onclick=()=>ir('m'+b.dataset.m));
  app.insertAdjacentHTML('beforeend','<div class="fila" style="justify-content:center;margin-top:18px"><button class="btn blanco sm" id="sal">👤 No soy '+esc(S.name)+': cambiar de alumno</button></div>');$('#sal').onclick=()=>{salir();ir('login')};
}

/* ---------- ACCESO: ¿QUIÉN ERES? ---------- */
const pinOK=v=>/^\d{4}$/.test(v);
const respDesbloqueo=ch=>{let h=2166136261;for(const c of ch.toUpperCase()+'|DESBLOQUEO|BIT'){h^=c.charCodeAt(0);h=Math.imul(h,16777619)>>>0}return String(h%10000).padStart(4,'0')};
function login(app){
  const L=[...PER.lista].sort((a,b)=>a.grupo.localeCompare(b.grupo)||a.name.localeCompare(b.name));

function ordenable(ul,onEnd){
  if(window.Sortable) Sortable.create(ul,{animation:150,handle:'.handle',ghostClass:'ghost',onEnd});

function quiz(el,m,preguntas){
  const est=S.m[m].quizR||{};
  el.innerHTML=`<div class="panel"><h2>Quiz rápido</h2><p class="muted">Solo cuenta tu primer intento: ¡piénsalo bien antes de pulsar!</p>
  ${preguntas.map((q,i)=>`<div class="q" data-i="${i}"><b>${i+1}. ${q.p}</b><div class="ops">${q.o.map((o,j)=>`<button class="op" data-j="${j}">${o}</button>`).join('')}</div><div class="fb"></div></div>`).join('')}
  <div id="qres"></div></div>`;
  const pintar=()=>{
    preguntas.forEach((q,i)=>{ if(est[i]===undefined)return;
      const box=el.querySelector(`.q[data-i="${i}"]`); box.querySelectorAll('.op').forEach(b=>{b.disabled=true; const j=+b.dataset.j; if(j===q.c)b.classList.add('bien'); else if(j===est[i])b.classList.add('malo')});
      box.querySelector('.fb').innerHTML=`<div class="nota ${est[i]===q.c?'ok':'mal'}">${est[i]===q.c?'✅ ¡Correcto!':'❌ No era esa.'} ${q.e}</div>`});
    if(Object.keys(est).length===preguntas.length){
      const bien=preguntas.filter((q,i)=>est[i]===q.c).length;
      S.m[m].quiz=bien; save();
      el.querySelector('#qres').innerHTML=`<div class="nota ok"><b>Resultado: ${bien} de ${preguntas.length}.</b> ${bien===preguntas.length?'¡Pleno!':'Repasa las explicaciones de las que fallaste.'}</div>`;
      done(m,'quiz')
    }
  };
  el.querySelectorAll('.op').forEach(b=>b.onclick=()=>{
    const i=+b.closest('.q').dataset.i, j=+b.dataset.j; if(est[i]!==undefined)return;
    est[i]=j; S.m[m].quizR=est; save(); if(j===preguntas[i].c) addXP(`m${m}-q${i}`,5); pintar();
  });
  pintar();
}

function flowEst(items){
  return `<ol class="flow">${items.map((it,i)=>{
    if(it.k==='decision') return `<li><div class="blk decision estatico" data-p="${i}">◆ ${it.t}</div><div class="ramas">${['si','no'].map(r=>`<div class="sub"><div class="subt">${r==='si'?'SÍ':'NO'}</div>${(it[r]||[]).map((x,j)=>`<div class="stp" data-p="${i}-${r}-${j}">${x}</div>`).join('')||'<div class="muted" style="font-size:.85rem">(nada)</div>'}</div>`).join('')}</div></li>`;
    if(it.k==='bucle') return `<li><div class="blk bucle estatico" data-p="${i}">🔁 ${it.t}</div><div class="ramas una"><div class="sub"><div class="subt">Se repite:</div>${it.cuerpo.map((x,j)=>`<div class="stp" data-p="${i}-c-${j}">${x}</div>`).join('')}</div></div></li>`;

const TIPOS={inicio:'Inicio',proceso:'Proceso',decision:'Decisión',entrada:'Entrada',salida:'Salida',bucle:'Repetir',fin:'Fin'};
function nuevoBloque(tipo){const b={id:'b'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),tipo,texto:''};if(tipo==='decision'){b.si=[''];b.no=['']}if(tipo==='bucle'){b.veces=3;b.siempre=false;b.cuerpo=['']}return b}
let pend=null;
function preguntarSiNo(q){return new Promise(res=>{pend=res;const a=$('#ask');a.innerHTML=`<div class="ask"><b>🤖 BIT te pregunta:</b> ${esc(q)}<div class="fila" style="margin-top:8px"><button class="btn verde sm" data-a="1">SÍ</button><button class="btn rojo sm" data-a="0">NO</button></div></div>`;a.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{a.innerHTML='';pend=null;res(b.dataset.a==='1')})})}
function pedirDato(q){return new Promise(res=>{pend=res;const a=$('#ask');a.innerHTML=`<div class="ask"><b>📥 ${esc(q)}</b><div class="fila" style="margin-top:8px"><input class="campo" id="dat" style="flex:1;min-width:140px" autocomplete="off"><button class="btn sm" id="okd">Enviar</button></div></div>`;const i=$('#dat');i.focus();const f=()=>{const v=i.value.trim();if(!v){i.focus();return}a.innerHTML='';pend=null;res(v)};$('#okd').onclick=f;i.onkeydown=e=>{if(e.key==='Enter')f()}})}
function validar(f,cfg){
  if(!f.length)return['El diagrama está vacío. Empieza con «+ Inicio».',-1];
  if(f[0].tipo!=='inicio')return['Todo diagrama empieza con el bloque INICIO arriba del todo.',0];
  const n=t=>f.filter(b=>b.tipo===t).length;
  if(n('inicio')>1)return['Solo puede haber un INICIO.',f.findIndex((b,i)=>i>0&&b.tipo==='inicio')];
  if(n('fin')>1)return['Solo puede haber un FIN.',f.findIndex(b=>b.tipo==='fin')];
  const is=f.findIndex(b=>b.tipo==='bucle'&&b.siempre);
  if(is>=0&&is<f.length-1)return['Un bucle «para siempre» no termina nunca: lo que pongas debajo (también el FIN) no se ejecutará jamás. Quita esos bloques o pon un número de repeticiones.',is];
  if(f[f.length-1].tipo!=='fin'&&is!==f.length-1)return['El último bloque tiene que ser FIN. Si no, ¿cómo sabe BIT que ha terminado?',f.length-1];
  for(let i=0;i<f.length;i++){const b=f[i];
    if(['proceso','entrada','salida'].includes(b.tipo)&&!b.texto.trim())return[`Hay un bloque de ${TIPOS[b.tipo].toLowerCase()} sin texto. Escribe qué hace BIT.`,i];
    if(b.tipo==='decision'){
      if(!b.texto.trim())return['Escribe la pregunta dentro del rombo.',i];
      if(!b.texto.includes('?'))return['La pregunta de una decisión se responde con SÍ o NO: escríbela entre signos de interrogación, por ejemplo «¿Llueve?».',i];
      if(![...b.si,...b.no].some(t=>t.trim()))return['Pon al menos un paso en la rama SÍ o en la rama NO.',i];
    }
    if(b.tipo==='bucle'){
      if(!b.siempre&&!(b.veces>=2&&b.veces<=100))return['El número de repeticiones tiene que estar entre 2 y 100.',i];
      if(!b.cuerpo.some(t=>t.trim()))return['Escribe qué pasos se repiten dentro del bucle.',i];
    }
  }
  const r=cfg.req&&cfg.req(f); if(r)return[r,-1];
  return null;
}

    }};

    if(t.hasAttribute('data-del')){S.m[m].flow=F().filter(x=>x!==b)}
    else if(t.dataset.subadd){b[t.dataset.subadd].push('')}
    else if(t.dataset.subdel){b[t.dataset.subdel].splice(+t.dataset.j,1);if(t.dataset.subdel==='cuerpo'&&!b.cuerpo.length)b.cuerpo.push('')}
    else return; save();pintar()});
  ordenable(fl,()=>{const ids=[...fl.children].map(li=>li.dataset.id);S.m[m].flow=ids.map(B).filter(Boolean);save();pintar()});
  el.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const t=b.dataset.add,nb=nuevoBloque(t),f=F();

async function correSent(g){
  const bit=$('#bg'),bb=$('#bb'),sc=$('#sc'),cnt=$('#cnt');bit.setAttribute('class','bit shirt');sc.classList.remove('feliz','shake');cnt.textContent=0;
  const nom={agach:'Agacharse',levanta:'Levantarse',saluda:'Saludar',aplaude:'Aplaudir'};
  let abajo=false,reps=0;
  const hacer=async(a,pref)=>{if(a==='nada')return null;bb.textContent=`${pref}${nom[a]}`;
    if(a==='agach'){if(abajo)return'¡BIT ya está agachado y no puede bajar más! 😵 Revisa el orden: después de agacharse tiene que levantarse.';abajo=true;bit.classList.add('agachado')}
    else if(a==='levanta'){if(!abajo)return'BIT ya está de pie… ¡no puede levantarse otra vez! 🤔 Primero tiene que agacharse.';abajo=false;bit.classList.remove('agachado');cnt.textContent=++reps}
    else if(a==='saluda'){bit.classList.add('saluda');await sleep(380);bit.classList.remove('saluda')}
    else if(a==='aplaude'){bit.classList.add('aplaude');bb.textContent='👏 ¡Clap!';await sleep(200);bit.classList.remove('aplaude');await sleep(120);bit.classList.add('aplaude');await sleep(200);bit.classList.remove('aplaude')}
    await sleep(380);return null};
  if(g.n<1)return[false,'Pon un número de repeticiones.'];
  if(g.b1==='nada'&&g.b2==='nada')return[false,'El bucle está vacío: BIT se queda quieto esperando órdenes. 😐'];
  for(let k=1;k<=g.n;k++){for(const a of [g.b1,g.b2]){const e=await hacer(a,`Vuelta ${k}: `);if(e){sacude(sc);return[false,e]}}}
  if(abajo){sacude(sc);return[false,'¡BIT se ha quedado agachado! 🦵 Le falta levantarse en cada vuelta.']}
  const e=await hacer(g.post,'Después: ');if(e){sacude(sc);return[false,e]}
  if(reps<10)return[false,`BIT solo ha hecho ${reps} sentadilla${reps===1?'':'s'}. ¡Le faltan ${10-reps}!`];
  if(reps>10)return[false,`BIT ha hecho ${reps} sentadillas y el entrenador pedía 10. ¡Te sobran ${reps-10} vueltas!`];
  if(g.post!=='saluda'){sacude(sc);return[false,g.post==='nada'?'Las 10 sentadillas están perfectas, pero BIT no ha saludado al terminar. ¿Qué bloque falta después del bucle?':`Las 10 sentadillas están perfectas, pero al final BIT tenía que saludar, no ${nom[g.post].toLowerCase()}.`]}
  if([g.b1,g.b2].includes('saluda'))return[false,'BIT ha saludado en cada sentadilla. El saludo va fuera del bucle, solo una vez al final.'];
  sc.classList.add('feliz');bb.textContent='¡10 sentadillas y un saludo! 💪👋';
  return[true,'<b>¡Reto superado!</b> Con un bucle de 2 acciones repetido 10 veces, BIT ha hecho 20 movimientos. Y el saludo fuera del bucle solo se hace una vez.'];
}
async function correCuad(g){
  const tr=$('#trazos'),to=$('#tort'),bb=$('#bb');tr.innerHTML='';
  let x=90,y=230,ang=-90,lados=0,giros=new Set();const x0=x,y0=y;
  const pon=()=>{to.style.transform=`translate(${x}px,${y}px) rotate(${ang}deg)`};pon();await sleep(300);
  if(g.n<1)return[false,'Pon un número de repeticiones.'];
  const cuerpo=[g.b1,g.b2].filter(a=>a!=='nada');
  if(!cuerpo.length)return[false,'El bucle está vacío: BIT no se mueve y la hoja sigue en blanco.'];
  for(let k=1;k<=g.n;k++){for(const a of cuerpo){
    if(a==='avanza'){const nx=x+100*Math.cos(ang*Math.PI/180),ny=y+100*Math.sin(ang*Math.PI/180);
      const l=document.createElementNS('http://www.w3.org/2000/svg','line');l.setAttribute('x1',x);l.setAttribute('y1',y);l.setAttribute('x2',x);l.setAttribute('y2',y);tr.appendChild(l);
      x=nx;y=ny;pon();bb.textContent=`Vuelta ${k}: avanzo 100 pasos ✏️`;
      for(let t=1;t<=10;t++){l.setAttribute('x2',+l.getAttribute('x1')+(x-l.getAttribute('x1'))*t/10);l.setAttribute('y2',+l.getAttribute('y1')+(y-l.getAttribute('y1'))*t/10);await sleep(35)}lados++}
    else{const d={g90:90,g120:120,g60:60}[a];giros.add(d);ang+=d;pon();bb.textContent=`Vuelta ${k}: giro ${d}° ↻`;await sleep(420)}}}
  const cerrado=Math.hypot(x-x0,y-y0)<1;
  if(!cuerpo.includes('avanza'))return[false,'BIT solo gira sobre sí mismo: sin avanzar, el lápiz no dibuja nada. 🌀'];
  if(!cuerpo.some(a=>a!=='avanza'))return[false,'BIT avanza siempre en línea recta… ¡y se sale de la hoja! Le falta girar en cada esquina.'];
  if(giros.has(120)||giros.has(60)){const f=giros.has(120)?'un triángulo':'un hexágono';return[false,`¡Eso no es un cuadrado! Con ese giro BIT dibuja ${cerrado?'':'parte de '}${f}. Las esquinas de un cuadrado miden 90°.`]}
  if(lados<4)return[false,`BIT solo ha dibujado ${lados} lado${lados===1?'':'s'} y el cuadrado ha quedado abierto. ¡Faltan ${4-lados}!`];
  if(lados>4)return[false,`El cuadrado se ve bien… pero BIT ha repasado ${lados-4} lado${lados-4===1?'':'s'} de más. Sobran vueltas en el bucle.`];
  bb.textContent='¡Cuadrado perfecto! ⬛🎉';
  return[true,'<b>¡Reto superado!</b> 4 vueltas de «avanzar y girar 90°». Así se dibuja con el lápiz de Scratch, que verás en la próxima unidad.'];
}

  dec('a','a) El obstáculo',4,{enun:'<p>BIT es ahora un robot aspirador. Cuando tiene algo delante, no debe chocar.</p>',preg:'¿Hay un obstáculo delante?',ops:['Avanzar','Girar a la derecha','Apagarse para siempre','Volver a la base de carga'],si:'Girar a la derecha',no:'Avanzar',casos:[['🤖 ➡️ 🧱 (hay una pared)',true],['🤖 ➡️ ⬜ (camino libre)',false]]});
  dec('b','b) La batería',3,{enun:'<p>El aspirador tiene que volver a cargarse antes de quedarse sin batería.</p>',preg:'¿Queda menos del 20 % de batería?',ops:['Seguir limpiando','Volver a la base de carga','Apagarse','Girar a la derecha'],si:'Volver a la base de carga',no:'Seguir limpiando',casos:[['🔋 15 %',true],['🔋 80 %',false]]});
  mcq(box,ctx,'c','c) La pregunta del rombo',3,{enun:'<p>BIT debe encender las luces <b>solo cuando sea de noche</b>. ¿Qué escribes dentro del rombo?</p>',ops:['¿Qué hora es?','¿Es de noche?','Encender las luces','¿Cuántas luces hay?'],c:1,e:'Solo «¿Es de noche?» se responde con SÍ o NO.'});
};

RET[3]=(box,ctx)=>{
  mcq(box,ctx,'a','a) El saludo',3,{enun:`<p>Escribes <b>Leo</b> cuando BIT te lo pide. ¿Qué muestra?</p>${flowEst([{k:'inicio'},{k:'entrada',t:'Pedir tu nombre'},{k:'salida',t:'Mostrar «¡A por ello, [dato]!»'},{k:'fin'}])}`,ops:['«¡A por ello, [dato]!»','«¡A por ello, Leo!»','«Pedir tu nombre»','«Leo»'],c:1,e:'[dato] se sustituye por lo que escribiste.'});
  const d=itemBox(box,'b','b) La calculadora',4,ctx),cu=d.querySelector('.cuerpo'),h=practico(d,ctx,'b',4,1,1);
  cu.innerHTML=`<p>Escribes <b>A = 4</b> y <b>B = 7</b>. ¿Qué número muestra BIT?</p>${flowEst([{k:'inicio'},{k:'entrada',t:'Pedir el número A'},{k:'entrada',t:'Pedir el número B'},{k:'proceso',t:'Calcular A × 2 + B'},{k:'salida',t:'Mostrar el resultado'},{k:'fin'}])}
   <div class="fila"><input class="campo" id="nb" inputmode="numeric" style="max-width:140px" aria-label="Resultado"><button class="btn verde sm" id="cb">✔ Comprobar</button><button class="btn blanco sm" id="rb">🏳️ Me rindo</button></div>`;
  $('#cb').onclick=()=>{const v=$('#nb').value.trim().replace(',','.');if(!v)return;if(+v===15)h.acierto('4 × 2 + 7 = 15.');else h.fallo('Ese no es el resultado. Sigue el diagrama paso a paso.')};
  $('#rb').onclick=h.rendir;if(h.bloqueado())cu.querySelectorAll('button,input').forEach(b=>b.disabled=true);
  mcq(box,ctx,'c','c) La nota',3,{enun:`<p>Escribes <b>12</b> cuando BIT te pide la nota. ¿Qué muestra?</p>${flowEst([{k:'inicio'},{k:'entrada',t:'Pedir tu nota'},{k:'decision',t:'¿Está entre 0 y 10?',si:['📤 Mostrar «Nota guardada»'],no:['📤 Mostrar «Nota no válida»']},{k:'fin'}])}`,ops:['«Nota guardada»','«Nota no válida»','«12»','No muestra nada'],c:1,e:'12 no está entre 0 y 10, así que BIT sigue la rama NO.'});
};
/* Reto 5 */
function montarBloques(cont,get,set,angs){
  let destino=-1;
  const pieza=(b,edit)=>{const x=edit?'<button class="x" aria-label="Quitar bloque">✕</button>':'';
    if(b.k==='lapiz')return `<li class="pz lapiz" data-k="lapiz">✏️ bajar el lápiz${x}</li>`;
    if(b.k==='avanza')return `<li class="pz avanza" data-k="avanza">avanzar 100 pasos${x}</li>`;
    if(b.k==='gira')return `<li class="pz gira" data-k="gira">girar a la derecha ${edit?`<select aria-label="Grados">${angs.map(a=>`<option ${a===b.a?'selected':''}>${a}</option>`).join('')}</select>°`:'↻'}${x}</li>`;
    return `<li class="pz rep" data-k="rep"><div class="cab">🔁 repetir ${edit?`<input type="number" min="1" max="20" value="${b.n}" aria-label="Veces"> veces`:'veces'}${x}</div><ul class="pzlist">${(b.in||[]).map(c=>pieza(c,edit)).join('')}</ul></li>`};
  const leer=ul=>[...ul.children].filter(li=>li.dataset&&li.dataset.k).map(li=>{const k=li.dataset.k,b={k};
    if(k==='gira'){const s=li.querySelector(':scope>select');b.a=s?+s.value:angs[0]}
    if(k==='rep'){const i=li.querySelector(':scope>.cab>input');b.n=i?parseInt(i.value)||1:2;const inn=li.querySelector(':scope>.pzlist');b.in=inn?leer(inn):[]}return b});
  let bloqueado=false;
  const pintar=()=>{
    cont.innerHTML=`<div class="grid2" style="gap:12px;grid-template-columns:minmax(0,.75fr) minmax(0,1.25fr)"><div><h3>Paleta</h3><ul class="pzlist paleta">${[{k:'lapiz'},{k:'avanza'},{k:'gira'},{k:'rep'}].map(b=>pieza(b,false)).join('')}</ul><p class="muted" style="font-size:.85rem">Arrastra o pulsa. Pulsa dentro de un «repetir» para meter ahí los siguientes bloques.</p></div>
     <div><h3>Programa</h3><div class="ws"><ul class="pzlist"><li class="pz hat">▶ al empezar</li></ul><ul class="pzlist wsl">${get().map(b=>pieza(b,true)).join('')}</ul></div></div></div>`;
    const ws=cont.querySelector('.wsl'),pal=cont.querySelector('.paleta');
    if(bloqueado){cont.querySelectorAll('button,input,select').forEach(b=>b.disabled=true);return}
    const guardar=()=>set(leer(ws)),reinit=()=>{guardar();pintar()};
    if(window.Sortable){Sortable.create(pal,{group:{name:'pz7',pull:'clone',put:false},sort:false,animation:150,forceFallback:true,fallbackTolerance:4});
      [ws,...ws.querySelectorAll('.pz.rep>.pzlist')].forEach(u=>Sortable.create(u,{group:'pz7',animation:150,forceFallback:true,fallbackTolerance:4,fallbackOnBody:true,swapThreshold:.6,filter:'input,select,button',preventOnFilter:false,onAdd:()=>setTimeout(reinit,0),onEnd:()=>setTimeout(reinit,0)}))}
    [...ws.children].forEach((li,i)=>{if(li.dataset.k==='rep'){li.dataset.idx=i;if(i===destino)li.querySelector(':scope>.pzlist').style.outline='3px solid #16263D'}});
    ws.closest('.ws').addEventListener('click',e=>{if(e.target.closest('button,input,select'))return;const r=e.target.closest('.wsl>.pz.rep'),nd=r?+r.dataset.idx:-1;if(nd!==destino){destino=nd;pintar()}});
    pal.querySelectorAll('.pz').forEach(p=>p.onclick=()=>{guardar();const k=p.dataset.k,nb=k==='gira'?{k,a:angs[0]}:k==='rep'?{k,n:2,in:[]}:{k},W=get(),dd=W[destino];if(dd&&dd.k==='rep'&&k!=='rep')dd.in.push(nb);else W.push(nb);set(W);pintar()});
    ws.addEventListener('change',guardar);ws.addEventListener('input',guardar);
    ws.addEventListener('click',e=>{const x=e.target.closest('.x');if(!x)return;const li=x.closest('.pz');if(li.parentElement===ws&&li.dataset.k==='rep')destino=-1;li.remove();guardar();pintar()})};
  pintar();return{bloquear:()=>{bloqueado=true;pintar()},leer:()=>{if(!bloqueado)set(leer(cont.querySelector('.wsl')));return get()}}}
async function trazar(wrap,P,x0=90,y0=250){
  const tr=wrap.querySelector('.trazos'),to=wrap.querySelector('.tort');tr.innerHTML='';
  let x=x0,y=y0,ang=-90,pen=false,lados=0,movs=0,giros=new Set(),pasos=0;
  const pon=()=>{to.style.transform=`translate(${x}px,${y}px) rotate(${ang}deg)`};pon();
  const corre=async L=>{for(const b of L){if(++pasos>300)return;
    if(b.k==='lapiz'){pen=true;await sleep(200)}
    else if(b.k==='avanza'){const xa=x,ya=y;x+=100*Math.cos(ang*Math.PI/180);y+=100*Math.sin(ang*Math.PI/180);let l=null;
      if(pen){l=document.createElementNS('http://www.w3.org/2000/svg','line');l.setAttribute('x1',xa);l.setAttribute('y1',ya);tr.appendChild(l)}pon();
      for(let t=1;t<=8;t++){if(l){l.setAttribute('x2',xa+(x-xa)*t/8);l.setAttribute('y2',ya+(y-ya)*t/8)}await sleep(30)}movs++;if(pen)lados++}
    else if(b.k==='gira'){ang+=b.a;giros.add(b.a);pon();await sleep(300)}
    else if(b.k==='rep'){for(let k=0;k<b.n;k++)await corre(b.in)}}};
  await corre(P);return{lados,movs,giros,cerrado:Math.hypot(x-x0,y-y0)<1}}
function evalFigura(st,P,n,a,fig){const figs={60:'un hexágono',72:'un pentágono',90:'un cuadrado',120:'un triángulo',144:'una estrella'};
  if(!P.length)return[false,'El programa está vacío.'];if(!st.movs)return[false,'BIT no se ha movido: falta «avanzar».'];
  if(!st.lados)return[false,'BIT se ha movido, pero no ha dibujado nada: ¡falta bajar el lápiz!'];if(!st.giros.size)return[false,'BIT va en línea recta: le falta girar.'];
  if(st.giros.size>1)return[false,'Has usado giros diferentes: en una figura regular todas las esquinas giran lo mismo.'];
  const g=[...st.giros][0];if(g!==a)return[false,`Con giros de ${g}° sale ${figs[g]||'otra figura'}, no ${fig}.`];
  if(st.lados<n)return[false,`Solo ${st.lados} lados: la figura ha quedado abierta.`];if(st.lados>n)return[false,`BIT ha repasado ${st.lados-n} lado(s) de más: sobran vueltas.`];
  if(!P.some(b=>b.k==='rep'))return[false,'La figura está bien, pero sin bloque «repetir». Usa un bucle.'];return[true,'']}
RET[4]=(box,ctx)=>{
  const d=itemBox(box,'a','a) El hexágono',6,ctx),cu=d.querySelector('.cuerpo'),h=practico(d,ctx,'a',6,2,1);
  if(!ctx.R.prog)ctx.R.prog=[];
  cu.innerHTML=`<p>Programa a BIT para que dibuje un <b>hexágono</b>: 6 lados iguales que se cierran justo donde empezó. Tienes que usar un bloque <b>repetir</b>. Recuerda la regla que descubriste en la Misión 6.</p>
   <div class="grid2" style="grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)"><div id="ed7"></div><div><div class="lienzo" id="lz7"><svg viewBox="0 0 320 320" aria-label="Lienzo"><g class="trazos" stroke="#E0474C" stroke-width="5" stroke-linecap="round" fill="none"></g><g class="tort" style="transform:translate(90px,250px) rotate(-90deg);transition:transform .3s linear"><circle r="13" fill="var(--bitc)" stroke="#16263D" stroke-width="3"/><path d="M7 -6 L17 0 L7 6 Z" fill="#FFC23D" stroke="#16263D" stroke-width="2"/></g></svg></div></div></div>
   <div class="fila" style="margin-top:10px"><button class="btn verde sm" id="e7">▶ Ejecutar y comprobar</button><button class="btn blanco sm" id="r7">🏳️ Me rindo</button></div>`;
  const ed=montarBloques($('#ed7'),()=>ctx.R.prog,v=>{ctx.R.prog=v;ctx.save()},[60,72,90,120,144]);
  if(h.bloqueado()){ed.bloquear();cu.querySelectorAll('.fila button').forEach(b=>b.disabled=true)}
  $('#e7').onclick=async()=>{const P=ed.leer();$('#e7').disabled=true;const st=await trazar($('#lz7'),P);$('#e7').disabled=false;const [ok,msg]=evalFigura(st,P,6,60,'un hexágono');if(ok){h.acierto('¡Hexágono perfecto! 6 × 60° = 360°.');ed.bloquear()}else h.fallo(msg)};
  $('#r7').onclick=async()=>{await h.rendir();if(h.bloqueado())ed.bloquear()};
  mcq(box,ctx,'b','b) ¿Qué dibuja?',2,{enun:`<p>¿Qué figura dibuja BIT con este programa?</p><ul class="pzlist" style="max-width:320px"><li class="pz hat">▶ al empezar</li><li class="pz lapiz" style="cursor:default">✏️ bajar el lápiz</li><li class="pz rep" style="cursor:default"><div class="cab">🔁 repetir 3 veces</div><ul class="pzlist"><li class="pz avanza" style="cursor:default">avanzar 100 pasos</li><li class="pz gira" style="cursor:default">girar a la derecha 120°</li></ul></li></ul>`,ops:['Un cuadrado','Un triángulo','Un hexágono','Una línea recta'],c:1,e:'3 lados y 3 × 120° = 360°: un triángulo.'});
  mcq(box,ctx,'c','c) Compilador o intérprete',2,{enun:'<p>Un programa de 10 líneas tiene un error en la <b>línea 5</b>. Si lo ejecutas con un <b>intérprete</b>, ¿qué pasa?</p>',ops:['No se ejecuta ninguna línea','Se ejecutan las líneas 1 a 4 y se para en la 5','Se ejecutan las 10 líneas','Se salta la línea 5 y sigue'],c:1,e:'El intérprete va línea a línea y se para al encontrar el error.'});
};
PH[7].resultado=(el)=>{
  const c=S.m[7],of=c.oficial,ul=c.ultimo;
  if(!of){el.innerHTML='<div class="panel"><h2>Todavía no tienes resultados</h2><p>Completa los 5 retos de la competición.</p></div>';return}
  const tabla=res=>`<table class="tabla">${RETOS.map((r,i)=>`<tr><td>${r.emo} Reto ${i+1}: ${r.t}</td><td style="width:40%"><div class="barra"><i style="width:${res.acc[i]*10}%"></i></div></td><td><b>${res.acc[i]}</b>/10</td></tr>`).join('')}</table>`;
  el.innerHTML=`<div class="grid2"><div class="panel"><h2>Tu marcador</h2>${tabla(of)}
   <div class="grid3" style="grid-template-columns:repeat(3,minmax(0,1fr));margin-top:16px">
    <div class="concepto" style="text-align:center"><div class="muted">Nota SdA</div><div style="font-family:var(--display);font-size:2rem;font-weight:700">${notaSdA(of.acc)}</div></div>
    <div class="concepto" style="text-align:center"><div class="muted">Puntos ranking</div><div style="font-family:var(--display);font-size:2rem;font-weight:700">${puntos(of.acc,of.t)}</div></div>
    <div class="concepto" style="text-align:center"><div class="muted">Tiempo</div><div style="font-family:var(--display);font-size:2rem;font-weight:700">${mmss(of.t)}</div></div></div>
   <p class="muted" style="margin-top:10px">Puntos del ranking = puntos de los retos × 20 + bonus de rapidez (hasta 100). La nota no depende del tiempo.</p></div>
   <div class="panel" style="text-align:center"><h2>Tu código</h2><p>Dile a tu profesor <b>tu nombre</b> y este código para entrar en el ranking de la clase:</p>
    <div class="codigoRes">${of.code}</div><p style="margin-top:12px"><b>${esc(S.name)}</b> · ${esc(S.grupo)}</p>
    ${ul?`<div class="nota idea" style="text-align:left">🏋️ Último entrenamiento (no cuenta): nota ${notaSdA(ul.acc)}, ${puntos(ul.acc,ul.t)} puntos, ${mmss(ul.t)}.</div>`:''}
    <div class="fila" style="justify-content:center;margin-top:12px"><button class="btn amarillo" id="ent">🔁 Entrenar otra vez</button></div></div></div>`;
  $('#ent').onclick=()=>ir('m7',0);
  done(7,'resultado');
};

$('#tema').onclick=()=>{const r=document.documentElement,oscuro=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=oscuro?'light':'dark';try{localStorage.setItem('academiaBit3.tema',r.dataset.theme)}catch(e){}};
